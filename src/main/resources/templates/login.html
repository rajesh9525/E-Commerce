<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In – NexaMart</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --y: #FFE500;
            --b: #111;
            --t: #6B7280;
            --bdr: #E5E7EB;
        }

        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            background: #fff;
        }

        .left {
            width: 45%;
            background: var(--b);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 60px;
            position: relative;
            overflow: hidden;
        }

        .left::before {
            content: '';
            position: absolute;
            bottom: -100px;
            right: -100px;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: var(--y);
            opacity: 0.08;
        }

        .left::after {
            content: '';
            position: absolute;
            top: -80px;
            left: -80px;
            width: 250px;
            height: 250px;
            border-radius: 50%;
            background: var(--y);
            opacity: 0.06;
        }

        .brand {
            font-size: 32px;
            font-weight: 900;
            color: #fff;
            margin-bottom: 14px;
        }

        .brand span {
            background: var(--y);
            color: var(--b);
            padding: 2px 10px;
            border-radius: 7px;
        }

        .left-tag {
            color: rgba(255, 255, 255, 0.5);
            font-size: 15px;
            text-align: center;
            margin-bottom: 50px;
            line-height: 1.7;
        }

        .feat-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
            width: 100%;
        }

        .feat-item {
            display: flex;
            align-items: center;
            gap: 12px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            font-weight: 600;
        }

        .feat-item .dot {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: var(--y);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--b);
            font-size: 16px;
            flex-shrink: 0;
        }

        .right {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 40px;
        }

        .form-box {
            width: 100%;
            max-width: 400px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--t);
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 32px;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: var(--b);
        }

        .form-box h2 {
            font-size: 30px;
            font-weight: 900;
            margin-bottom: 6px;
        }

        .form-box .sub {
            color: var(--t);
            font-size: 14px;
            margin-bottom: 32px;
        }

        .field {
            margin-bottom: 18px;
        }

        .field label {
            display: block;
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--b);
            margin-bottom: 7px;
        }

        .input-wrap {
            position: relative;
        }

        .input-wrap i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--t);
            font-size: 16px;
        }

        .input-wrap input {
            width: 100%;
            padding: 14px 14px 14px 44px;
            border: 2px solid var(--bdr);
            border-radius: 12px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 15px;
            color: var(--b);
            background: #fff;
            transition: all 0.25s;
            outline: none;
        }

        .input-wrap input:focus {
            border-color: var(--b);
            box-shadow: 4px 4px 0 var(--y);
        }

        .input-wrap input::placeholder {
            color: #C4C4C4;
        }

        .btn-login {
            width: 100%;
            padding: 15px;
            border: 2px solid var(--b);
            border-radius: 12px;
            background: var(--y);
            color: var(--b);
            font-size: 16px;
            font-weight: 900;
            font-family: 'Plus Jakarta Sans', sans-serif;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 4px;
        }

        .btn-login:hover {
            background: var(--b);
            color: #fff;
            box-shadow: 4px 4px 0 var(--y);
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 22px 0;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--bdr);
        }

        .divider span {
            font-size: 12px;
            color: var(--t);
            font-weight: 700;
        }

        .link-row {
            text-align: center;
            font-size: 14px;
            color: var(--t);
        }

        .link-row a {
            color: var(--b);
            font-weight: 800;
            text-decoration: none;
            border-bottom: 2px solid var(--y);
        }
    </style>
</head>

<body>
    <div class="left">
        <div class="brand">Nexa<span>Mart</span></div>
        <p class="left-tag">India's smartest role-based<br>e-commerce platform 🛍️</p>
        <div class="feat-list">
            <div class="feat-item">
                <div class="dot"><i class="bi bi-shield-check"></i></div> Secure role-based access
            </div>
            <div class="feat-item">
                <div class="dot"><i class="bi bi-lightning-charge-fill"></i></div> Lightning-fast checkout
            </div>
            <div class="feat-item">
                <div class="dot"><i class="bi bi-truck"></i></div> Real-time delivery tracking
            </div>
            <div class="feat-item">
                <div class="dot"><i class="bi bi-graph-up-arrow"></i></div> Admin analytics dashboard
            </div>
        </div>
    </div>
    <div class="right">
        <div class="form-box">
            <a href="/home" class="back-link"><i class="bi bi-arrow-left"></i> Back to Home</a>
            <h2>Welcome Back 👋</h2>
            <p class="sub">Sign in to your NexaMart account</p>
            <form action="/user/login" method="post">
                <div class="field">
                    <label>Email Address</label>
                    <div class="input-wrap">
                        <i class="bi bi-envelope-fill"></i>
                        <input type="email" name="email" placeholder="you@email.com" required>
                    </div>
                </div>
                <div class="field">
                    <label>Password</label>
                    <div class="input-wrap">
                        <i class="bi bi-lock-fill"></i>
                        <input type="password" name="password" placeholder="••••••••" required>
                    </div>
                </div>
                <button type="submit" class="btn-login"><i class="bi bi-arrow-right-circle-fill"></i> Sign In to
                    NexaMart</button>
            </form>
            <div class="divider"><span>or</span></div>
            <div class="link-row">New to NexaMart? <a href="/register">Create Account →</a></div>
        </div>
    </div>
</body>

</html>
