<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register – ShopSphere</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        * {
            font-family: 'Inter', sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .auth-card {
            width: 460px;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            padding: 44px 40px;
            animation: slideUp 0.6s ease-out;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.4);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .brand {
            font-size: 28px;
            font-weight: 800;
            color: #fff;
            text-align: center;
            margin-bottom: 6px;
        }

        .brand span {
            color: #6c63ff;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.5);
            text-align: center;
            font-size: 13px;
            margin-bottom: 28px;
        }

        .form-label {
            color: rgba(255, 255, 255, 0.8);
            font-size: 13px;
            font-weight: 600;
        }

        .form-control,
        .form-select {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            color: #fff;
            padding: 12px 16px;
            transition: all 0.3s;
        }

        .form-control:focus,
        .form-select:focus {
            background: rgba(255, 255, 255, 0.12);
            border-color: #6c63ff;
            box-shadow: 0 0 0 3px rgba(108, 99, 255, 0.2);
            color: #fff;
        }

        .form-select option {
            background: #1a1a2e;
            color: #fff;
        }

        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .input-icon {
            position: relative;
        }

        .input-icon i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.4);
        }

        .input-icon .form-control,
        .input-icon .form-select {
            padding-left: 40px;
        }

        .btn-register {
            background: linear-gradient(135deg, #11998e, #38ef7d);
            border: none;
            border-radius: 12px;
            font-weight: 700;
            padding: 13px;
            font-size: 15px;
            transition: all 0.3s;
            box-shadow: 0 4px 20px rgba(56, 239, 125, 0.3);
            color: #111;
        }

        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(56, 239, 125, 0.4);
            color: #111;
        }

        .divider {
            color: rgba(255, 255, 255, 0.3);
            text-align: center;
            margin: 18px 0;
            font-size: 13px;
        }

        .link-login {
            color: rgba(255, 255, 255, 0.6);
            text-align: center;
            font-size: 13px;
        }

        .link-login a {
            color: #6c63ff;
            font-weight: 700;
            text-decoration: none;
        }

        .link-login a:hover {
            text-decoration: underline;
        }

        .role-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <div class="auth-card">
        <div class="brand">Shop<span>Sphere</span></div>
        <p class="subtitle">Create your account to get started.</p>

        <form action="/user/register" method="post">
            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <div class="input-icon">
                    <i class="bi bi-person"></i>
                    <input type="text" name="name" class="form-control" placeholder="John Doe" required>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Email Address</label>
                <div class="input-icon">
                    <i class="bi bi-envelope"></i>
                    <input type="email" name="email" class="form-control" placeholder="you@example.com" required>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <div class="input-icon">
                    <i class="bi bi-lock"></i>
                    <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label">Account Role</label>
                <div class="input-icon">
                    <i class="bi bi-shield-check"></i>
                    <select name="logintype" class="form-select" required>
                        <option value="CUSTOMER">🛒 Customer</option>
                        <option value="SELLER">🏪 Seller</option>
                        <option value="DELIVERY">🚚 Delivery</option>
                    </select>
                </div>
            </div>
            <button type="submit" class="btn btn-register w-100">Create Account</button>
        </form>

        <div class="divider">─── or ───</div>
        <div class="link-login">Already have an account? <a href="/login">Sign In</a></div>
    </div>
</body>

</html>
