<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account – NexaMart</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --y: #FFE500;
            --b: #111;
            --t: #6B7280;
            --bdr: #E5E7EB;
        }

        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            background: #FAFAFA;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .card {
            width: 100%;
            max-width: 520px;
            background: #fff;
            border: 2px solid var(--b);
            border-radius: 24px;
            padding: 48px 44px;
            box-shadow: 8px 8px 0 var(--y);
        }

        .brand {
            font-size: 24px;
            font-weight: 900;
            text-align: center;
            margin-bottom: 6px;
        }

        .brand span {
            background: var(--y);
            padding: 2px 9px;
            border-radius: 6px;
        }

        .sub {
            color: var(--t);
            font-size: 14px;
            text-align: center;
            margin-bottom: 32px;
        }

        .field {
            margin-bottom: 16px;
        }

        .field label {
            display: block;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--b);
            margin-bottom: 7px;
        }

        .input-wrap {
            position: relative;
        }

        .input-wrap i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--t);
            font-size: 15px;
        }

        .input-wrap input {
            width: 100%;
            padding: 13px 14px 13px 42px;
            border: 2px solid var(--bdr);
            border-radius: 11px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 14px;
            color: var(--b);
            background: #fff;
            transition: all 0.25s;
            outline: none;
        }

        .input-wrap input:focus {
            border-color: var(--b);
            box-shadow: 4px 4px 0 var(--y);
        }

        .input-wrap input::placeholder {
            color: #C4C4C4;
        }

        .role-label {
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--b);
            margin-bottom: 10px;
            display: block;
        }

        .role-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 4px;
        }

        .role-opt {
            display: none;
        }

        .role-lbl {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 14px 8px;
            border: 2px solid var(--bdr);
            border-radius: 12px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 800;
            color: var(--t);
            transition: all 0.2s;
            text-align: center;
        }

        .role-lbl .ri {
            font-size: 24px;
        }

        .role-opt:checked+.role-lbl {
            border-color: var(--b);
            color: var(--b);
            background: var(--y);
            box-shadow: 3px 3px 0 var(--b);
        }

        .btn-reg {
            width: 100%;
            padding: 15px;
            border: 2px solid var(--b);
            border-radius: 12px;
            background: var(--b);
            color: #fff;
            font-size: 16px;
            font-weight: 900;
            font-family: 'Plus Jakarta Sans', sans-serif;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }

        .btn-reg:hover {
            background: var(--y);
            color: var(--b);
            box-shadow: 4px 4px 0 var(--b);
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 20px 0;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--bdr);
        }

        .divider span {
            font-size: 12px;
            color: var(--t);
            font-weight: 700;
        }

        .link-row {
            text-align: center;
            font-size: 14px;
            color: var(--t);
        }

        .link-row a {
            color: var(--b);
            font-weight: 800;
            text-decoration: none;
            border-bottom: 2px solid var(--y);
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="brand">Nexa<span>Mart</span></div>
        <p class="sub">Create your free account today ✨</p>
        <form action="/user/register" method="post">
            <div class="field">
                <label>Full Name</label>
                <div class="input-wrap">
                    <i class="bi bi-person-fill"></i>
                    <input type="text" name="name" placeholder="Your full name" required>
                </div>
            </div>
            <div class="field">
                <label>Email Address</label>
                <div class="input-wrap">
                    <i class="bi bi-envelope-fill"></i>
                    <input type="email" name="email" placeholder="you@email.com" required>
                </div>
            </div>
            <div class="field">
                <label>Password</label>
                <div class="input-wrap">
                    <i class="bi bi-lock-fill"></i>
                    <input type="password" name="password" placeholder="••••••••" required>
                </div>
            </div>
            <div class="field">
                <span class="role-label">I am a...</span>
                <div class="role-grid">
                    <label><input type="radio" name="logintype" value="CUSTOMER" class="role-opt" required>
                        <div class="role-lbl"><span class="ri">🛍️</span>Customer</div>
                    </label>
                    <label><input type="radio" name="logintype" value="SELLER" class="role-opt">
                        <div class="role-lbl"><span class="ri">🏪</span>Seller</div>
                    </label>
                    <label><input type="radio" name="logintype" value="DELIVERY" class="role-opt">
                        <div class="role-lbl"><span class="ri">🚚</span>Delivery</div>
                    </label>
                </div>
            </div>
            <button type="submit" class="btn-reg"><i class="bi bi-check-circle-fill"></i> Create My Account</button>
        </form>
        <div class="divider"><span>or</span></div>
        <div class="link-row">Already have an account? <a href="/login">Sign In →</a></div>
    </div>
</body>

</html>
