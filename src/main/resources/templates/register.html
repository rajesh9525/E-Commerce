<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account – NexaMart</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: #07070f;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .card {
            width: 100%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 28px;
            padding: 48px 44px;
            animation: fadeUp 0.6s ease-out;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: -200px;
            right: -100px;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(124, 58, 237, 0.12) 0%, transparent 70%);
            pointer-events: none;
        }

        .card::after {
            content: '';
            position: absolute;
            bottom: -150px;
            left: -100px;
            width: 350px;
            height: 350px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(6, 182, 212, 0.07) 0%, transparent 70%);
            pointer-events: none;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(24px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .brand {
            font-size: 28px;
            font-weight: 900;
            text-align: center;
            margin-bottom: 6px;
        }

        .brand .n {
            color: #fff;
        }

        .brand .x {
            background: linear-gradient(135deg, #7c3aed, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .sub {
            color: rgba(255, 255, 255, 0.4);
            font-size: 14px;
            text-align: center;
            margin-bottom: 36px;
        }

        .field {
            margin-bottom: 18px;
        }

        .field label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.45);
            margin-bottom: 7px;
        }

        .input-wrap {
            position: relative;
        }

        .input-wrap i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.3);
            font-size: 15px;
        }

        .input-wrap input,
        .input-wrap select {
            width: 100%;
            padding: 13px 15px 13px 42px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: 13px;
            color: #fff;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s;
            outline: none;
            appearance: none;
        }

        .input-wrap input:focus,
        .input-wrap select:focus {
            border-color: #7c3aed;
            background: rgba(124, 58, 237, 0.07);
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.12);
        }

        .input-wrap input::placeholder {
            color: rgba(255, 255, 255, 0.2);
        }

        .input-wrap select option {
            background: #1a0f3c;
            color: #fff;
        }

        .role-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 4px;
        }

        .role-opt {
            display: none;
        }

        .role-lbl {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 14px 8px;
            border-radius: 12px;
            border: 1.5px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
            font-size: 12px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.5);
            transition: all 0.25s;
            text-align: center;
        }

        .role-lbl i {
            font-size: 22px;
        }

        .role-opt:checked+.role-lbl {
            border-color: #7c3aed;
            color: #a78bfa;
            background: rgba(124, 58, 237, 0.12);
        }

        .btn-register {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 14px;
            margin-top: 10px;
            background: linear-gradient(135deg, #10b981, #059669);
            color: #fff;
            font-size: 16px;
            font-weight: 800;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(16, 185, 129, 0.35);
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-register:hover {
            box-shadow: 0 0 40px rgba(16, 185, 129, 0.5);
            transform: translateY(-2px);
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 20px 0;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.08);
        }

        .divider span {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.3);
            font-weight: 600;
        }

        .link-row {
            text-align: center;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.4);
        }

        .link-row a {
            color: #a78bfa;
            font-weight: 700;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="brand"><span class="n">Nexa</span><span class="x">Mart</span></div>
        <p class="sub">Create your account — it's free forever ✨</p>

        <form action="/user/register" method="post">
            <div class="field">
                <label>Full Name</label>
                <div class="input-wrap">
                    <i class="bi bi-person-fill"></i>
                    <input type="text" name="name" placeholder="John Doe" required>
                </div>
            </div>
            <div class="field">
                <label>Email Address</label>
                <div class="input-wrap">
                    <i class="bi bi-envelope-fill"></i>
                    <input type="email" name="email" placeholder="you@example.com" required>
                </div>
            </div>
            <div class="field">
                <label>Password</label>
                <div class="input-wrap">
                    <i class="bi bi-lock-fill"></i>
                    <input type="password" name="password" placeholder="••••••••" required>
                </div>
            </div>
            <div class="field">
                <label>I am a...</label>
                <div class="role-grid">
                    <label>
                        <input type="radio" name="logintype" value="CUSTOMER" class="role-opt" required>
                        <div class="role-lbl"><i class="bi bi-bag-heart-fill" style="color:#f59e0b;"></i>Customer</div>
                    </label>
                    <label>
                        <input type="radio" name="logintype" value="SELLER" class="role-opt">
                        <div class="role-lbl"><i class="bi bi-shop-window" style="color:#10b981;"></i>Seller</div>
                    </label>
                    <label>
                        <input type="radio" name="logintype" value="DELIVERY" class="role-opt">
                        <div class="role-lbl"><i class="bi bi-truck" style="color:#06b6d4;"></i>Delivery</div>
                    </label>
                </div>
            </div>
            <button type="submit" class="btn-register"><i class="bi bi-check-circle-fill"></i> Create My
                Account</button>
        </form>
        <div class="divider"><span>or</span></div>
        <div class="link-row">Already have an account? <a href="/login">Sign in →</a></div>
    </div>
</body>

</html>
