<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #198754, #20c997);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .register-card {
            width: 450px;
            padding: 35px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
            animation: fadeIn 0.8s ease-in-out;
        }

        .register-title {
            font-weight: 700;
            color: #198754;
        }

        .form-control {
            border-radius: 10px;
            padding: 10px;
        }

        .btn-register {
            border-radius: 10px;
            font-weight: 600;
            padding: 10px;
        }

        .link-text a {
            text-decoration: none;
            font-weight: 600;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px);} 
            to { opacity: 1; transform: translateY(0);} 
        }
    </style>
</head>
<body>

<div class="register-card">
    <h3 class="text-center register-title mb-4">Create Account</h3>

    <form action="/user/register" method="post">
        <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" name="name" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Select Role</label>
            <select name="logintype" class="form-control" required>
                <option value="CUSTOMER">Customer</option>
                <option value="SELLER">Seller</option>
                <option value="DELIVERY">delivery</option>
            </select>
        </div>

        <button class="btn btn-success w-100 btn-register">Register</button>

        <div class="text-center mt-3 link-text">
            <a href="/login">Already have an account? Login</a>
        </div>
    </form>
</div>

</body>
</html>
