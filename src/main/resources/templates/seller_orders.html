<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Orders – NexaMart</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --y: #FFE500;
            --b: #111111;
            --g: #22C55E;
            --t: #6B7280;
            --bdr: #E5E7EB;
            --bg: #FAFAFA;
            --r: #EF4444;
        }

        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg);
            color: var(--b);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* TOP NAVBAR */
        .navbar {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid var(--bdr);
            padding: 12px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        .brand {
            font-size: 24px;
            font-weight: 900;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
        }

        .brand span {
            background: var(--y);
            padding: 2px 8px;
            border-radius: 6px;
            color: var(--b);
            margin-left: 4px;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--t);
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            transition: all 0.2s;
            cursor: pointer;
        }

        .nav-link:hover {
            background: var(--bg);
            color: var(--b);
            transform: translateY(-2px);
        }

        .nav-link.active {
            background: var(--y);
            color: var(--b);
            box-shadow: 3px 3px 0 var(--b);
            border: 2px solid var(--b);
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        /* MAIN */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .topbar {
            padding: 20px 40px;
            border-bottom: 2px solid var(--bdr);
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 90;
        }

        .topbar h5 {
            font-size: 18px;
            font-weight: 900;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--b);
        }

        .badge-role {
            background: var(--b);
            color: var(--y);
            padding: 6px 14px;
            border-radius: 8px;
            font-weight: 900;
            font-size: 12px;
            border: 2px solid var(--b);
        }

        .content {
            padding: 40px;
        }

        .page-banner {
            background: #fff;
            border: 2px solid var(--b);
            border-radius: 20px;
            padding: 28px 40px;
            margin-bottom: 32px;
            box-shadow: 8px 8px 0 var(--y);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-image: radial-gradient(var(--bdr) 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .page-banner h4 {
            font-size: 28px;
            font-weight: 900;
            margin-bottom: 4px;
            background: #fff;
            display: inline-block;
            padding-right: 10px;
        }

        .page-banner p {
            color: var(--t);
            font-size: 14px;
            font-weight: 600;
            background: #fff;
            display: inline-block;
            padding-right: 10px;
        }

        /* TABLE */
        .table-wrap {
            background: #fff;
            border: 2px solid var(--bdr);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.03);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead th {
            background: var(--bg);
            color: var(--t);
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 16px 20px;
            border-bottom: 2px solid var(--bdr);
            text-align: left;
        }

        tbody tr {
            border-bottom: 1px solid var(--bdr);
            transition: background 0.2s;
        }

        tbody tr:hover {
            background: var(--bg);
        }

        tbody tr:last-child {
            border-bottom: none;
        }

        td {
            padding: 16px 20px;
            font-size: 14px;
            vertical-align: middle;
            font-weight: 600;
        }

        .stat-chip {
            display: inline-flex;
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 800;
            border: 2px solid;
            align-items: center;
            gap: 4px;
            text-transform: uppercase;
        }

        .stat-Ordered {
            background: #DBEAFE;
            color: #2563EB;
            border-color: #BFDBFE;
        }

        .stat-Dispatched {
            background: #FEF3C7;
            color: #D97706;
            border-color: #FCD34D;
        }

        .stat-Delivered {
            background: #D1FAE5;
            color: #059669;
            border-color: #6EE7B7;
        }

        .empty {
            text-align: center;
            padding: 60px 20px;
            color: var(--t);
        }

        .empty i {
            font-size: 48px;
            color: var(--bdr);
            margin-bottom: 16px;
        }

        .empty p {
            font-weight: 700;
        }

        .p-block {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .p-name {
            font-weight: 800;
            color: var(--b);
        }

        .p-dt {
            font-size: 12px;
            color: var(--t);
        }

        /* ASSIGN FORM */
        .assign-form {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .assign-form select {
            padding: 8px 12px;
            border: 2px solid var(--bdr);
            border-radius: 8px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 13px;
            font-weight: 700;
            outline: none;
            background: #fff;
        }

        .assign-form select:focus {
            border-color: var(--b);
        }

        .btn-assign {
            padding: 8px 16px;
            background: var(--b);
            color: #fff;
            border: 2px solid var(--b);
            border-radius: 8px;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-assign:hover {
            background: var(--y);
            color: var(--b);
            box-shadow: 3px 3px 0 var(--b);
        }

        .assigned-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--bg);
            border: 1px solid var(--bdr);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            color: var(--t);
            font-weight: 700;
        }

        .assigned-badge i {
            color: var(--g);
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <div class="brand">Nexa<span>Mart</span></div>
        <div class="nav-links">
            <a href="/sellerdashboard" class="nav-link"><i class="bi bi-shop-window"></i> My Products</a>
            <a href="/product/add" class="nav-link"><i class="bi bi-plus-square"></i> Add Product</a>
            <a href="/orders/seller" class="nav-link active"><i class="bi bi-bag"></i> Orders</a>
        </div>
        <div class="nav-actions">
            <div class="badge-role">SELLER 🏪</div>
            <a href="/logout" class="nav-link"
                style="color:var(--r); border:2px solid var(--r); background:transparent;"><i
                    class="bi bi-box-arrow-right"></i> Sign Out</a>
        </div>
    </nav>

    <div class="main">
        <div class="content">
            <div class="page-banner">
                <div>
                    <h4>Customer Purchases 📦</h4>
                    <p>Assign delivery partners to pending orders.</p>
                </div>
            </div>

            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Order ID</th>
                            <th>Product</th>
                            <th>Customer</th>
                            <th>Amount</th>
                            <th>Status</th>
                            <th>Delivery Partner</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(orders)}">
                            <td colspan="6">
                                <div class="empty"><i class="bi bi-box2"></i>
                                    <p>No orders received yet.</p>
                                </div>
                            </td>
                        </tr>
                        <tr th:each="o : ${orders}">
                            <td style="font-family:monospace;font-weight:700;" th:text="'#' + ${o.id}"></td>

                            <td>
                                <th:block th:if="${o.productid != null}">
                                    <div class="p-block">
                                        <span class="p-name"
                                            th:text="${productMap[o.productid] != null ? productMap[o.productid].productName : 'Unknown'}"></span>
                                    </div>
                                </th:block>
                                <th:block th:if="${o.items != null && !#lists.isEmpty(o.items)}">
                                    <div class="p-block">
                                        <span class="p-name" th:each="item : ${o.items}"
                                            th:text="${item.productName}"></span>
                                    </div>
                                </th:block>
                                <span
                                    th:if="${o.productid == null && (o.items == null || #lists.isEmpty(o.items))}">N/A</span>
                            </td>

                            <td>
                                <div class="p-block">
                                    <span class="p-name" th:text="${o.customerName}"></span>
                                    <span class="p-dt" th:text="${o.city}"></span>
                                </div>
                            </td>

                            <td>
                                <th:block th:if="${o.productid != null}">
                                    <span
                                        th:text="${productMap[o.productid] != null ? '₹' + productMap[o.productid].productprice : 'N/A'}"
                                        style="color:var(--g);font-weight:800;"></span>
                                </th:block>
                                <th:block th:if="${o.items != null && !#lists.isEmpty(o.items)}">
                                    <span th:each="item : ${o.items}" th:text="'₹' + ${item.price}"
                                        style="color:var(--g);font-weight:800; display:block;"></span>
                                </th:block>
                            </td>

                            <!-- Status Dropdown (Pending to Shipped) -->
                            <td>
                                <form th:action="@{/orders/update-status}" method="post">
                                    <input type="hidden" name="orderId" th:value="${o.id}">

                                    <select name="status" onchange="this.form.submit()" class="stat-chip"
                                        th:classappend="'stat-' + ${o.status}"
                                        th:if="${o.status == 'PENDING' || o.status == 'SHIPPED'}">
                                        <option th:selected="${o.status == 'PENDING'}" value="PENDING">Pending</option>
                                        <option th:selected="${o.status == 'SHIPPED'}" value="SHIPPED">Shipped</option>
                                    </select>

                                    <span th:if="${o.status != 'PENDING' && o.status != 'SHIPPED'}"
                                        th:class="'stat-chip stat-' + ${o.status}" th:text="${o.status}"></span>
                                </form>
                            </td>

                            <!-- Delivery Assignment -->
                            <td>
                                <!-- IF NOT ASSIGNED -->
                                <form th:if="${o.deliveryMan == null}" th:action="@{/orders/assign-delivery}"
                                    method="post" class="assign-form">
                                    <input type="hidden" name="orderId" th:value="${o.id}">
                                    <select name="deliveryId" required>
                                        <option value="" disabled selected>Assign partner...</option>
                                        <option th:each="d : ${deliveryPartners}" th:value="${d.id}"
                                            th:text="${d.name + ' (' + d.email + ')'}"></option>
                                    </select>
                                    <button type="submit" class="btn-assign">Assign</button>
                                </form>

                                <!-- IF ASSIGNED -->
                                <div th:if="${o.deliveryMan != null}" class="assigned-badge">
                                    <i class="bi bi-person-check-fill"></i> <span
                                        th:text="${o.deliveryMan.name}"></span>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</body>

</html>
