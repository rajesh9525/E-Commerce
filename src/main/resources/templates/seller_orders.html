<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seller Orders – NexaMart</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --g: #10b981;
            --bg: #07070f;
            --brd: rgba(255, 255, 255, 0.08);
        }

        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: #fff;
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 260px;
            min-height: 100vh;
            background: rgba(255, 255, 255, 0.02);
            border-right: 1px solid var(--brd);
            padding: 28px 16px;
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            left: 0;
            height: 100%;
            overflow-y: auto;
        }

        .brand {
            font-size: 22px;
            font-weight: 900;
            padding: 8px 14px 26px;
            border-bottom: 1px solid var(--brd);
            margin-bottom: 22px;
        }

        .brand .n {
            color: #fff;
        }

        .brand .x {
            background: linear-gradient(135deg, #7c3aed, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav-sec {
            font-size: 10px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.25);
            letter-spacing: 1.8px;
            text-transform: uppercase;
            padding: 0 14px;
            margin: 16px 0 8px;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 11px;
            color: rgba(255, 255, 255, 0.55);
            text-decoration: none;
            padding: 11px 14px;
            border-radius: 13px;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.25s;
            margin-bottom: 3px;
            border: 1px solid transparent;
        }

        .nav-link:hover,
        .nav-link.active {
            background: rgba(16, 185, 129, 0.1);
            border-color: rgba(16, 185, 129, 0.2);
            color: #6ee7b7;
        }

        .nav-link i {
            font-size: 18px;
            width: 24px;
        }

        .sidebar-foot {
            margin-top: auto;
            padding-top: 16px;
            border-top: 1px solid var(--brd);
        }

        .main {
            margin-left: 260px;
            flex: 1;
        }

        .topbar {
            padding: 20px 36px;
            border-bottom: 1px solid var(--brd);
            background: rgba(255, 255, 255, 0.02);
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 10;
            backdrop-filter: blur(20px);
        }

        .topbar h5 {
            font-size: 18px;
            font-weight: 800;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chip {
            padding: 7px 18px;
            border-radius: 50px;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.3);
            font-size: 12px;
            font-weight: 800;
            color: #6ee7b7;
        }

        .content {
            padding: 32px 36px;
        }

        .page-banner {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.1), rgba(6, 182, 212, 0.05));
            border: 1px solid rgba(16, 185, 129, 0.18);
            border-radius: 22px;
            padding: 28px 32px;
            margin-bottom: 28px;
        }

        .page-banner h4 {
            font-size: 22px;
            font-weight: 900;
            margin-bottom: 4px;
        }

        .page-banner p {
            color: rgba(255, 255, 255, 0.4);
            font-size: 13px;
            margin: 0;
        }

        .table-wrap {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--brd);
            border-radius: 20px;
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead th {
            background: rgba(16, 185, 129, 0.07);
            color: rgba(255, 255, 255, 0.45);
            font-size: 10.5px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 14px 18px;
            border-bottom: 1px solid var(--brd);
        }

        tbody tr {
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            transition: background 0.2s;
        }

        tbody tr:hover {
            background: rgba(255, 255, 255, 0.025);
        }

        tbody tr:last-child {
            border-bottom: none;
        }

        td {
            padding: 15px 18px;
            font-size: 14px;
            vertical-align: middle;
        }

        select {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #fff;
            padding: 8px 12px;
            font-size: 13px;
            font-family: 'Inter', sans-serif;
            outline: none;
            margin-right: 8px;
        }

        select option {
            background: #1a0f3c;
        }

        .btn-assign {
            padding: 8px 16px;
            border-radius: 10px;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.25);
            color: #6ee7b7;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .btn-assign:hover {
            background: rgba(16, 185, 129, 0.3);
            color: #a7f3d0;
        }

        .empty {
            text-align: center;
            padding: 56px;
            color: rgba(255, 255, 255, 0.2);
        }

        .empty i {
            font-size: 52px;
            display: block;
            margin-bottom: 14px;
        }

        .assign-form {
            display: flex;
            align-items: center;
            gap: 8px;
        }
    </style>
</head>

<body>
    <div class="sidebar">
        <div class="brand"><span class="n">Nexa</span><span class="x">Mart</span></div>
        <div class="nav-sec">Seller</div>
        <a href="/sellerdashboard" class="nav-link"><i class="bi bi-grid-3x3-gap-fill"></i> My Products</a>
        <a href="/product/add" class="nav-link"><i class="bi bi-plus-circle-fill"></i> Add Product</a>
        <a href="/orders/seller" class="nav-link active"><i class="bi bi-bag-fill"></i> Orders</a>
        <div class="sidebar-foot">
            <a href="/logout" class="nav-link" style="color:rgba(255,107,107,0.7);"><i
                    class="bi bi-box-arrow-right"></i> Logout</a>
        </div>
    </div>
    <div class="main">
        <div class="topbar">
            <h5><i class="bi bi-bag-fill" style="color:#6ee7b7;"></i>Seller Orders</h5>
            <span class="chip"><i class="bi bi-shop-window me-1"></i>SELLER</span>
        </div>
        <div class="content">
            <div class="page-banner">
                <h4>Manage Orders</h4>
                <p>Assign delivery partners to your customer orders</p>
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Order ID</th>
                            <th>Status</th>
                            <th>Delivery Partner</th>
                            <th>Assign</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(orders)}">
                            <td colspan="4">
                                <div class="empty"><i class="bi bi-inbox"></i>
                                    <p>No orders yet</p>
                                </div>
                            </td>
                        </tr>
                        <tr th:each="o : ${orders}">
                            <td><strong style="color:#6ee7b7;">#<span th:text="${o.id}"></span></strong></td>
                            <td style="color:rgba(255,255,255,0.5);" th:text="${o.status}"></td>
                            <td style="color:rgba(255,255,255,0.45);"
                                th:text="${o.deliveryMan != null ? o.deliveryMan.name : '— Not assigned'}"></td>
                            <td>
                                <form th:action="@{'/orders/assign/' + ${o.id}}" method="post" class="assign-form">
                                    <select name="deliveryId">
                                        <option th:each="d : ${deliveryList}" th:value="${d.id}" th:text="${d.name}">
                                        </option>
                                    </select>
                                    <button type="submit" class="btn-assign"><i class="bi bi-person-check-fill"></i>
                                        Assign</button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>

</html>
