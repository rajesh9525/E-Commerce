<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Approval – ShopSphere</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        * {
            font-family: 'Inter', sans-serif;
        }

        body {
            background: #0f0e17;
            color: #fff;
            display: flex;
            min-height: 100vh;
            margin: 0;
        }

        .sidebar {
            width: 250px;
            min-height: 100vh;
            flex-shrink: 0;
            background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
            border-right: 1px solid rgba(255, 255, 255, 0.07);
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            left: 0;
            height: 100%;
            overflow-y: auto;
        }

        .sidebar .logo {
            font-size: 22px;
            font-weight: 800;
            color: #fff;
            padding: 8px 12px 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            margin-bottom: 20px;
        }

        .sidebar .logo span {
            color: #6c63ff;
        }

        .nav-label {
            font-size: 10px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            padding: 0 12px;
            margin: 16px 0 6px;
        }

        .sidebar a {
            display: flex;
            align-items: center;
            gap: 10px;
            color: rgba(255, 255, 255, 0.65);
            text-decoration: none;
            padding: 11px 14px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.25s;
            margin-bottom: 4px;
        }

        .sidebar a:hover,
        .sidebar a.active {
            background: rgba(108, 99, 255, 0.2);
            color: #fff;
        }

        .sidebar a i {
            font-size: 17px;
            width: 22px;
        }

        .sidebar-footer {
            margin-top: auto;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .main {
            margin-left: 250px;
            flex: 1;
        }

        .topbar {
            background: rgba(255, 255, 255, 0.04);
            border-bottom: 1px solid rgba(255, 255, 255, 0.07);
            padding: 18px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .topbar h5 {
            margin: 0;
            font-weight: 700;
            font-size: 18px;
        }

        .admin-badge {
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
        }

        .content-area {
            padding: 28px 32px;
        }

        .page-header {
            background: linear-gradient(135deg, rgba(255, 107, 107, 0.1), rgba(108, 99, 255, 0.08));
            border: 1px solid rgba(255, 107, 107, 0.2);
            border-radius: 18px;
            padding: 24px 28px;
            margin-bottom: 24px;
        }

        .page-header h4 {
            margin: 0;
            font-weight: 800;
        }

        .page-header p {
            margin: 4px 0 0;
            color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
        }

        .card-table {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 18px;
            overflow: hidden;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
        }

        .data-table thead th {
            background: rgba(108, 99, 255, 0.12);
            color: rgba(255, 255, 255, 0.6);
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            padding: 14px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.07);
        }

        .data-table tbody tr {
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: background 0.2s;
        }

        .data-table tbody tr:hover {
            background: rgba(255, 255, 255, 0.04);
        }

        .data-table td {
            padding: 14px 16px;
            font-size: 14px;
            vertical-align: middle;
        }

        .product-img {
            width: 56px;
            height: 56px;
            object-fit: cover;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .badge-pending {
            background: rgba(255, 193, 7, 0.15);
            color: #ffc107;
            border: 1px solid rgba(255, 193, 7, 0.3);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
        }

        .badge-approved {
            background: rgba(56, 239, 125, 0.15);
            color: #38ef7d;
            border: 1px solid rgba(56, 239, 125, 0.3);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
        }

        .badge-rejected {
            background: rgba(255, 107, 107, 0.15);
            color: #ff6b6b;
            border: 1px solid rgba(255, 107, 107, 0.3);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
        }

        .btn-approve {
            background: rgba(56, 239, 125, 0.15);
            color: #38ef7d;
            border: 1px solid rgba(56, 239, 125, 0.3);
            border-radius: 8px;
            padding: 5px 14px;
            font-size: 12px;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.2s;
        }

        .btn-approve:hover {
            background: rgba(56, 239, 125, 0.3);
            color: #38ef7d;
        }

        .btn-reject {
            background: rgba(255, 107, 107, 0.15);
            color: #ff6b6b;
            border: 1px solid rgba(255, 107, 107, 0.3);
            border-radius: 8px;
            padding: 5px 14px;
            font-size: 12px;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.2s;
        }

        .btn-reject:hover {
            background: rgba(255, 107, 107, 0.3);
            color: #ff6b6b;
        }

        .empty-state {
            text-align: center;
            padding: 48px;
            color: rgba(255, 255, 255, 0.25);
        }

        .empty-state i {
            font-size: 48px;
            margin-bottom: 12px;
            display: block;
        }
    </style>
</head>

<body>
    <div class="sidebar">
        <div class="logo">Shop<span>Sphere</span></div>
        <div class="nav-label">Admin Panel</div>
        <a href="/admin/dashboard"><i class="bi bi-speedometer2"></i> Dashboard</a>
        <a href="/admin/product-requests" class="active"><i class="bi bi-bag-check-fill"></i> Product Requests</a>
        <a href="/admin/activity"><i class="bi bi-activity"></i> User Activity</a>
        <div class="sidebar-footer">
            <a href="/logout"><i class="bi bi-box-arrow-right"></i> Logout</a>
        </div>
    </div>
    <div class="main">
        <div class="topbar">
            <h5><i class="bi bi-bag-check-fill me-2" style="color:#ff6b6b;"></i>Product Approval</h5>
            <span class="admin-badge"><i class="bi bi-shield-fill me-1"></i>ADMIN</span>
        </div>
        <div class="content-area">
            <div class="page-header">
                <h4>Seller Product Requests</h4>
                <p>Review and approve or reject products submitted by sellers</p>
            </div>
            <div class="card-table">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Product Name</th>
                            <th>Details</th>
                            <th>Price</th>
                            <th>Seller</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(requests)}">
                            <td colspan="7">
                                <div class="empty-state"><i class="bi bi-inbox"></i>
                                    <p>No pending requests</p>
                                </div>
                            </td>
                        </tr>
                        <tr th:each="req : ${requests}">
                            <td style="color:rgba(255,255,255,0.35); font-size:13px;" th:text="${req.id}"></td>
                            <td><b th:text="${req.productname}"></b></td>
                            <td><span style="color:rgba(255,255,255,0.5); font-size:13px;"
                                    th:text="${req.productdetails}"></span></td>
                            <td><span style="color:#38ef7d; font-weight:700;"
                                    th:text="'₹' + ${req.productprice}"></span></td>
                            <td><span style="color:rgba(255,255,255,0.55);" th:text="${req.sellername}"></span></td>
                            <td>
                                <span th:if="${req.status == 'PENDING'}" class="badge-pending">PENDING</span>
                                <span th:if="${req.status == 'APPROVED'}" class="badge-approved">APPROVED</span>
                                <span th:if="${req.status == 'REJECTED'}" class="badge-rejected">REJECTED</span>
                            </td>
                            <td>
                                <a class="btn-approve" th:href="@{/admin/approve-product/{id}(id=${req.id})}"><i
                                        class="bi bi-check-circle me-1"></i>Approve</a>
                                <a class="btn-reject ms-1" th:href="@{/admin/reject-product/{id}(id=${req.id})}"><i
                                        class="bi bi-x-circle me-1"></i>Reject</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>

</html>
