<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Approval – NexaMart</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --r: #ef4444;
            --p: #7c3aed;
            --bg: #07070f;
            --brd: rgba(255, 255, 255, 0.08);
        }

        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: #fff;
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 260px;
            min-height: 100vh;
            background: rgba(255, 255, 255, 0.02);
            border-right: 1px solid var(--brd);
            padding: 28px 16px;
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            left: 0;
            height: 100%;
            overflow-y: auto;
        }

        .brand {
            font-size: 22px;
            font-weight: 900;
            padding: 8px 14px 26px;
            border-bottom: 1px solid var(--brd);
            margin-bottom: 22px;
        }

        .brand .n {
            color: #fff;
        }

        .brand .x {
            background: linear-gradient(135deg, #7c3aed, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav-sec {
            font-size: 10px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.25);
            letter-spacing: 1.8px;
            text-transform: uppercase;
            padding: 0 14px;
            margin: 16px 0 8px;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 11px;
            color: rgba(255, 255, 255, 0.55);
            text-decoration: none;
            padding: 11px 14px;
            border-radius: 13px;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.25s;
            margin-bottom: 3px;
            border: 1px solid transparent;
        }

        .nav-link:hover,
        .nav-link.active {
            background: rgba(124, 58, 237, 0.1);
            border-color: rgba(124, 58, 237, 0.2);
            color: #a78bfa;
        }

        .nav-link i {
            font-size: 18px;
            width: 24px;
        }

        .sidebar-foot {
            margin-top: auto;
            padding-top: 16px;
            border-top: 1px solid var(--brd);
        }

        .main {
            margin-left: 260px;
            flex: 1;
        }

        .topbar {
            padding: 20px 36px;
            border-bottom: 1px solid var(--brd);
            background: rgba(255, 255, 255, 0.02);
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 10;
            backdrop-filter: blur(20px);
        }

        .topbar h5 {
            font-size: 18px;
            font-weight: 800;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chip-admin {
            padding: 7px 18px;
            border-radius: 50px;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            font-size: 12px;
            font-weight: 800;
            color: #fca5a5;
        }

        .content {
            padding: 32px 36px;
        }

        .page-banner {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.1), rgba(124, 58, 237, 0.06));
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 22px;
            padding: 28px 32px;
            margin-bottom: 28px;
        }

        .page-banner h4 {
            font-size: 22px;
            font-weight: 900;
            margin-bottom: 4px;
        }

        .page-banner p {
            color: rgba(255, 255, 255, 0.4);
            font-size: 13px;
            margin: 0;
        }

        .table-wrap {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--brd);
            border-radius: 20px;
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead th {
            background: rgba(124, 58, 237, 0.07);
            color: rgba(255, 255, 255, 0.45);
            font-size: 10.5px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 14px 18px;
            border-bottom: 1px solid var(--brd);
        }

        tbody tr {
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            transition: background 0.2s;
        }

        tbody tr:hover {
            background: rgba(255, 255, 255, 0.025);
        }

        tbody tr:last-child {
            border-bottom: none;
        }

        td {
            padding: 15px 18px;
            font-size: 14px;
            vertical-align: middle;
        }

        .pimg {
            width: 56px;
            height: 56px;
            object-fit: cover;
            border-radius: 12px;
            border: 1px solid var(--brd);
        }

        .chip {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 5px 13px;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 700;
        }

        .chip-pending {
            background: rgba(245, 158, 11, 0.12);
            color: #fcd34d;
            border: 1px solid rgba(245, 158, 11, 0.25);
        }

        .chip-approved {
            background: rgba(16, 185, 129, 0.12);
            color: #6ee7b7;
            border: 1px solid rgba(16, 185, 129, 0.25);
        }

        .chip-rejected {
            background: rgba(239, 68, 68, 0.12);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.25);
        }

        .btn-t {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            text-decoration: none;
            border: 1px solid;
            transition: all 0.2s;
        }

        .btn-approve {
            background: rgba(16, 185, 129, 0.1);
            color: #6ee7b7;
            border-color: rgba(16, 185, 129, 0.25);
        }

        .btn-approve:hover {
            background: rgba(16, 185, 129, 0.25);
            color: #a7f3d0;
        }

        .btn-reject {
            background: rgba(239, 68, 68, 0.1);
            color: #fca5a5;
            border-color: rgba(239, 68, 68, 0.25);
        }

        .btn-reject:hover {
            background: rgba(239, 68, 68, 0.25);
            color: #fecaca;
        }

        .empty {
            text-align: center;
            padding: 60px;
            color: rgba(255, 255, 255, 0.2);
        }

        .empty i {
            font-size: 56px;
            display: block;
            margin-bottom: 14px;
        }
    </style>
</head>

<body>
    <div class="sidebar">
        <div class="brand"><span class="n">Nexa</span><span class="x">Mart</span></div>
        <div class="nav-sec">Admin Panel</div>
        <a href="/admin/dashboard" class="nav-link"><i class="bi bi-speedometer2"></i> Dashboard</a>
        <a href="/admin/product-requests" class="nav-link active"><i class="bi bi-bag-check-fill"></i> Product
            Requests</a>
        <a href="/admin/activity" class="nav-link"><i class="bi bi-activity"></i> User Activity</a>
        <div class="sidebar-foot">
            <a href="/logout" class="nav-link" style="color:rgba(255,107,107,0.7);"><i
                    class="bi bi-box-arrow-right"></i> Logout</a>
        </div>
    </div>
    <div class="main">
        <div class="topbar">
            <h5><i class="bi bi-bag-check-fill" style="color:#6ee7b7;"></i>Product Approval</h5>
            <span class="chip-admin"><i class="bi bi-shield-fill me-1"></i>ADMIN</span>
        </div>
        <div class="content">
            <div class="page-banner">
                <h4>Seller Product Requests</h4>
                <p>Review and approve or reject products submitted by sellers</p>
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Product</th>
                            <th>Details</th>
                            <th>Price</th>
                            <th>Seller</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(requests)}">
                            <td colspan="7">
                                <div class="empty"><i class="bi bi-inbox"></i>
                                    <p>No pending product requests</p>
                                </div>
                            </td>
                        </tr>
                        <tr th:each="req : ${requests}">
                            <td style="color:rgba(255,255,255,0.3);font-size:13px;" th:text="${req.id}"></td>
                            <td><strong th:text="${req.productname}"></strong></td>
                            <td style="color:rgba(255,255,255,0.4);font-size:13px;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"
                                th:text="${req.productdetails}"></td>
                            <td style="color:#6ee7b7;font-weight:800;" th:text="'₹' + ${req.productprice}"></td>
                            <td style="color:rgba(255,255,255,0.5);" th:text="${req.sellername}"></td>
                            <td>
                                <span th:if="${req.status == 'PENDING'}" class="chip chip-pending"><i
                                        class="bi bi-hourglass-split"></i>PENDING</span>
                                <span th:if="${req.status == 'APPROVED'}" class="chip chip-approved"><i
                                        class="bi bi-check-circle-fill"></i>APPROVED</span>
                                <span th:if="${req.status == 'REJECTED'}" class="chip chip-rejected"><i
                                        class="bi bi-x-circle-fill"></i>REJECTED</span>
                            </td>
                            <td style="display:flex;gap:6px;align-items:center;">
                                <a class="btn-t btn-approve" th:href="@{/admin/approve-product/{id}(id=${req.id})}"><i
                                        class="bi bi-check-circle"></i> Approve</a>
                                <a class="btn-t btn-reject" th:href="@{/admin/reject-product/{id}(id=${req.id})}"><i
                                        class="bi bi-x-circle"></i> Reject</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>

</html>
