<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Customer Dashboard – NexaMart</title>
	<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap"
		rel="stylesheet">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
	<style>
		:root {
			--y: #FFE500;
			--b: #111111;
			--g: #22C55E;
			--t: #6B7280;
			--bdr: #E5E7EB;
			--bg: #FAFAFA;
			--r: #EF4444;
		}

		*,
		*::before,
		*::after {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		body {
			font-family: 'Plus Jakarta Sans', sans-serif;
			background: var(--bg);
			color: var(--b);
			display: flex;
			min-height: 100vh;
		}

		/* SIDEBAR */
		.sidebar {
			width: 260px;
			min-height: 100vh;
			background: #fff;
			border-right: 2px solid var(--bdr);
			padding: 28px 20px;
			display: flex;
			flex-direction: column;
			position: fixed;
			top: 0;
			left: 0;
			height: 100%;
			z-index: 100;
		}

		.brand {
			font-size: 24px;
			font-weight: 900;
			padding: 8px 10px 26px;
			border-bottom: 2px solid var(--bdr);
			margin-bottom: 22px;
		}

		.brand span {
			background: var(--y);
			padding: 2px 8px;
			border-radius: 6px;
			color: var(--b);
		}

		.nav-sec {
			font-size: 11px;
			font-weight: 800;
			color: var(--t);
			text-transform: uppercase;
			letter-spacing: 1px;
			padding: 0 10px;
			margin: 16px 0 8px;
		}

		.nav-link {
			display: flex;
			align-items: center;
			gap: 12px;
			color: var(--t);
			text-decoration: none;
			padding: 12px 14px;
			border-radius: 12px;
			font-size: 14px;
			font-weight: 700;
			transition: all 0.2s;
			margin-bottom: 4px;
		}

		.nav-link:hover {
			background: var(--bg);
			color: var(--b);
		}

		.nav-link.active {
			background: var(--y);
			color: var(--b);
			box-shadow: 4px 4px 0 var(--b);
			border: 2px solid var(--b);
		}

		.nav-link i {
			font-size: 18px;
		}

		.sidebar-foot {
			margin-top: auto;
			padding-top: 16px;
			border-top: 2px solid var(--bdr);
		}

		/* MAIN */
		.main {
			margin-left: 260px;
			flex: 1;
		}

		.topbar {
			padding: 20px 40px;
			border-bottom: 2px solid var(--bdr);
			background: #fff;
			display: flex;
			align-items: center;
			justify-content: space-between;
			position: sticky;
			top: 0;
			z-index: 90;
		}

		.topbar h5 {
			font-size: 18px;
			font-weight: 900;
			margin: 0;
			display: flex;
			align-items: center;
			gap: 10px;
			color: var(--b);
		}

		.badge-role {
			background: var(--b);
			color: var(--y);
			padding: 6px 14px;
			border-radius: 8px;
			font-weight: 900;
			font-size: 12px;
			border: 2px solid var(--b);
		}

		.content {
			padding: 40px;
		}

		.page-banner {
			background: var(--y);
			border: 2px solid var(--b);
			border-radius: 20px;
			padding: 32px 40px;
			margin-bottom: 32px;
			box-shadow: 8px 8px 0 var(--b);
		}

		.page-banner h4 {
			font-size: 32px;
			font-weight: 900;
			margin-bottom: 4px;
		}

		.page-banner p {
			font-size: 15px;
			font-weight: 600;
			color: var(--b);
		}

		.search-wrap {
			position: relative;
			margin-bottom: 32px;
		}

		.search-wrap i {
			position: absolute;
			left: 20px;
			top: 50%;
			transform: translateY(-50%);
			font-size: 18px;
			color: var(--t);
		}

		.search-wrap input {
			width: 100%;
			padding: 16px 20px 16px 50px;
			border: 2px solid var(--bdr);
			border-radius: 16px;
			font-family: 'Plus Jakarta Sans', sans-serif;
			font-size: 15px;
			font-weight: 600;
			background: #fff;
			outline: none;
			transition: all 0.2s;
			box-shadow: 0 10px 30px rgba(0, 0, 0, 0.03);
		}

		.search-wrap input:focus {
			border-color: var(--b);
			box-shadow: 4px 4px 0 var(--y);
		}

		.p-grid {
			display: grid;
			grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
			gap: 24px;
		}

		.p-card {
			background: #fff;
			border: 2px solid var(--bdr);
			border-radius: 20px;
			overflow: hidden;
			transition: all 0.3s;
			display: flex;
			flex-direction: column;
		}

		.p-card:hover {
			border-color: var(--b);
			box-shadow: 8px 8px 0 var(--y);
			transform: translateY(-4px);
		}

		.p-img-wrap {
			height: 200px;
			background: var(--bg);
			border-bottom: 2px solid var(--bdr);
			display: flex;
			align-items: center;
			justify-content: center;
		}

		.p-img-wrap img {
			width: 100%;
			height: 100%;
			object-fit: cover;
		}

		.p-img-wrap i {
			font-size: 60px;
			color: var(--bdr);
		}

		.p-info {
			padding: 20px;
			flex: 1;
			display: flex;
			flex-direction: column;
		}

		.p-name {
			font-size: 16px;
			font-weight: 800;
			margin-bottom: 8px;
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
		}

		.p-price {
			font-size: 22px;
			font-weight: 900;
			color: var(--g);
			margin-bottom: 16px;
		}

		.btn-buy {
			margin-top: auto;
			width: 100%;
			padding: 12px;
			border: 2px solid var(--b);
			border-radius: 12px;
			background: var(--b);
			color: #fff;
			font-size: 14px;
			font-weight: 800;
			font-family: 'Plus Jakarta Sans', sans-serif;
			cursor: pointer;
			transition: all 0.3s;
			display: flex;
			align-items: center;
			justify-content: center;
			gap: 8px;
		}

		.btn-buy:hover {
			background: var(--y);
			color: var(--b);
			box-shadow: 4px 4px 0 var(--b);
		}

		.empty {
			text-align: center;
			padding: 80px 20px;
			color: var(--t);
		}

		.empty i {
			font-size: 60px;
			color: var(--bdr);
			margin-bottom: 20px;
			display: block;
		}

		.empty p {
			font-weight: 700;
			font-size: 18px;
		}
	</style>
</head>

<body>

	<div class="sidebar">
		<div class="brand">Nexa<span>Mart</span></div>
		<div class="nav-sec">Shopping</div>
		<a href="/customer/view-products" class="nav-link active"><i class="bi bi-grid-fill"></i> Browse Shop</a>
		<a href="/cart/view" class="nav-link"><i class="bi bi-cart"></i> My Cart</a>
		<a href="/orders/my-orders" class="nav-link"><i class="bi bi-bag-check"></i> Order History</a>
		<div class="sidebar-foot">
			<a href="/logout" class="nav-link" style="color:var(--r);"><i class="bi bi-box-arrow-right"></i> Sign
				Out</a>
		</div>
	</div>

	<div class="main">
		<div class="topbar">
			<h5>Shop Products</h5>
			<div class="badge-role">CUSTOMER 🛍️</div>
		</div>

		<div class="content">
			<div class="page-banner">
				<h4>Discover amazing products 🌟</h4>
				<p>Shop from tested and verified sellers across NexaMart</p>
			</div>

			<div class="search-wrap">
				<i class="bi bi-search"></i>
				<input type="text" placeholder="Search for products, electronics, clothing..."
					oninput="filterP(this.value)">
			</div>

			<div class="p-grid" id="grid">
				<div class="empty" th:if="${#lists.isEmpty(products)}" style="grid-column:1/-1;">
					<i class="bi bi-basket3"></i>
					<p>No products available yet. Check back soon!</p>
				</div>

				<div class="p-card" th:each="p : ${products}" th:attr="data-name=${p.productName}">
					<div class="p-img-wrap">
						<img th:if="${p.productimage != null}" th:src="@{'/product/image/' + ${p.id}}">
						<i th:unless="${p.productimage != null}" class="bi bi-image"></i>
					</div>
					<div class="p-info">
						<div class="p-name" th:text="${p.productName}"></div>
						<div class="p-price" th:text="'₹' + ${p.productprice}"></div>
						<div style="display:flex; gap:8px; margin-top:auto;">
							<form action="/orders/buy" method="post" style="flex:1;">
								<input type="hidden" name="productId" th:value="${p.id}">
								<button class="btn-buy" type="submit" style="width:100%;"><i class="bi bi-lightning-fill"></i> Buy Now</button>
							</form>
							<form action="/cart/add" method="post" style="flex:1;">
								<input type="hidden" name="productId" th:value="${p.id}">
								<button class="btn-buy" type="submit" style="width:100%; background:#fff; color:var(--b);"><i class="bi bi-cart-plus"></i> Add</button>
							</form>
						</div>
					</div>
				</div>
			</div>

		</div>
	</div>

	<script>
		function filterP(val) {
			const q = val.toLowerCase();
			document.querySelectorAll('.p-card').forEach(c => {
				c.style.display = c.dataset.name.toLowerCase().includes(q) ? '' : 'none';
			});
		}
	</script>
</body>

</html>
