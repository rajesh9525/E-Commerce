<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Shop – NexaMart</title>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
	<style>
		:root {
			--gold: #f59e0b;
			--bg: #07070f;
			--brd: rgba(255, 255, 255, 0.08);
		}

		*,
		*::before,
		*::after {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		body {
			font-family: 'Inter', sans-serif;
			background: var(--bg);
			color: #fff;
			display: flex;
			min-height: 100vh;
		}

		.sidebar {
			width: 260px;
			min-height: 100vh;
			background: rgba(255, 255, 255, 0.02);
			border-right: 1px solid var(--brd);
			padding: 28px 16px;
			display: flex;
			flex-direction: column;
			position: fixed;
			top: 0;
			left: 0;
			height: 100%;
			overflow-y: auto;
		}

		.brand {
			font-size: 22px;
			font-weight: 900;
			padding: 8px 14px 26px;
			border-bottom: 1px solid var(--brd);
			margin-bottom: 22px;
		}

		.brand .n {
			color: #fff;
		}

		.brand .x {
			background: linear-gradient(135deg, #7c3aed, #06b6d4);
			-webkit-background-clip: text;
			-webkit-text-fill-color: transparent;
			background-clip: text;
		}

		.nav-sec {
			font-size: 10px;
			font-weight: 700;
			color: rgba(255, 255, 255, 0.25);
			letter-spacing: 1.8px;
			text-transform: uppercase;
			padding: 0 14px;
			margin: 16px 0 8px;
		}

		.nav-link {
			display: flex;
			align-items: center;
			gap: 11px;
			color: rgba(255, 255, 255, 0.55);
			text-decoration: none;
			padding: 11px 14px;
			border-radius: 13px;
			font-size: 14px;
			font-weight: 600;
			transition: all 0.25s;
			margin-bottom: 3px;
			border: 1px solid transparent;
		}

		.nav-link:hover,
		.nav-link.active {
			background: rgba(245, 158, 11, 0.1);
			border-color: rgba(245, 158, 11, 0.2);
			color: #fcd34d;
		}

		.nav-link i {
			font-size: 18px;
			width: 24px;
		}

		.sidebar-foot {
			margin-top: auto;
			padding-top: 16px;
			border-top: 1px solid var(--brd);
		}

		.main {
			margin-left: 260px;
			flex: 1;
		}

		.topbar {
			padding: 20px 36px;
			border-bottom: 1px solid var(--brd);
			background: rgba(255, 255, 255, 0.02);
			display: flex;
			align-items: center;
			justify-content: space-between;
			position: sticky;
			top: 0;
			z-index: 10;
			backdrop-filter: blur(20px);
		}

		.topbar h5 {
			font-size: 18px;
			font-weight: 800;
			margin: 0;
			display: flex;
			align-items: center;
			gap: 10px;
		}

		.cust-chip {
			padding: 7px 18px;
			border-radius: 50px;
			background: rgba(245, 158, 11, 0.15);
			border: 1px solid rgba(245, 158, 11, 0.3);
			font-size: 12px;
			font-weight: 800;
			color: #fcd34d;
		}

		.content {
			padding: 32px 36px;
		}

		.page-banner {
			background: linear-gradient(135deg, rgba(245, 158, 11, 0.1), rgba(124, 58, 237, 0.05));
			border: 1px solid rgba(245, 158, 11, 0.18);
			border-radius: 22px;
			padding: 28px 32px;
			margin-bottom: 28px;
		}

		.page-banner h4 {
			font-size: 22px;
			font-weight: 900;
			margin-bottom: 4px;
		}

		.page-banner p {
			color: rgba(255, 255, 255, 0.4);
			font-size: 13px;
			margin: 0;
		}

		.search-row {
			display: flex;
			gap: 12px;
			margin-bottom: 28px;
		}

		.search-inp {
			flex: 1;
			padding: 12px 18px;
			background: rgba(255, 255, 255, 0.04);
			border: 1px solid rgba(255, 255, 255, 0.08);
			border-radius: 13px;
			color: #fff;
			font-size: 14px;
			font-family: 'Inter', sans-serif;
			outline: none;
			transition: all 0.3s;
		}

		.search-inp:focus {
			border-color: #f59e0b;
			background: rgba(245, 158, 11, 0.05);
		}

		.search-inp::placeholder {
			color: rgba(255, 255, 255, 0.25);
		}

		.p-grid {
			display: grid;
			grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
			gap: 20px;
		}

		.p-card {
			background: rgba(255, 255, 255, 0.04);
			border: 1px solid var(--brd);
			border-radius: 20px;
			overflow: hidden;
			transition: all 0.35s;
		}

		.p-card:hover {
			transform: translateY(-7px);
			border-color: rgba(245, 158, 11, 0.35);
			box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
		}

		.p-card img {
			width: 100%;
			height: 185px;
			object-fit: cover;
		}

		.p-card .no-img {
			width: 100%;
			height: 185px;
			background: rgba(255, 255, 255, 0.03);
			display: flex;
			align-items: center;
			justify-content: center;
		}

		.p-card .no-img i {
			font-size: 52px;
			color: rgba(255, 255, 255, 0.1);
		}

		.p-body {
			padding: 18px;
		}

		.p-name {
			font-size: 15px;
			font-weight: 800;
			margin-bottom: 4px;
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
		}

		.p-price {
			font-size: 20px;
			font-weight: 900;
			color: #fcd34d;
			margin-bottom: 14px;
		}

		.btn-buy {
			width: 100%;
			padding: 11px;
			border: none;
			border-radius: 11px;
			background: linear-gradient(135deg, #f59e0b, #d97706);
			color: #111;
			font-weight: 800;
			font-size: 14px;
			font-family: 'Inter', sans-serif;
			cursor: pointer;
			transition: all 0.3s;
			display: flex;
			align-items: center;
			justify-content: center;
			gap: 7px;
		}

		.btn-buy:hover {
			opacity: 0.9;
			transform: translateY(-1px);
		}

		.empty {
			text-align: center;
			padding: 70px;
			color: rgba(255, 255, 255, 0.2);
		}

		.empty i {
			font-size: 60px;
			display: block;
			margin-bottom: 16px;
		}
	</style>
</head>

<body>
	<div class="sidebar">
		<div class="brand"><span class="n">Nexa</span><span class="x">Mart</span></div>
		<div class="nav-sec">Shopping</div>
		<a href="/customer/view-products" class="nav-link active"><i class="bi bi-shop-window"></i> Browse Shop</a>
		<div class="sidebar-foot">
			<a href="/logout" class="nav-link" style="color:rgba(255,107,107,0.7);"><i
					class="bi bi-box-arrow-right"></i> Logout</a>
		</div>
	</div>
	<div class="main">
		<div class="topbar">
			<h5><i class="bi bi-shop-window" style="color:#fcd34d;"></i>Browse Products</h5>
			<span class="cust-chip"><i class="bi bi-person-fill me-1"></i>CUSTOMER</span>
		</div>
		<div class="content">
			<div class="page-banner">
				<h4>Discover Products ✨</h4>
				<p>Shop from verified sellers on NexaMart</p>
			</div>
			<div class="search-row">
				<input class="search-inp" type="text" placeholder="🔍  Search products..."
					oninput="filterProducts(this.value)">
			</div>
			<div class="p-grid" th:if="${!#lists.isEmpty(products)}" id="grid">
				<div class="p-card" th:each="product : ${products}" th:attr="data-name=${product.productName}">
					<img th:if="${product.productimage != null}" th:src="@{'/product/image/' + ${product.id}}"
						alt="product">
					<div th:unless="${product.productimage != null}" class="no-img"><i class="bi bi-image"></i></div>
					<div class="p-body">
						<div class="p-name" th:text="${product.productName}"></div>
						<div class="p-price" th:text="'₹' + ${product.productprice}"></div>
						<form action="/orders/buy" method="post">
							<input type="hidden" name="productId" th:value="${product.id}">
							<button type="submit" class="btn-buy"><i class="bi bi-cart-plus-fill"></i> Buy Now</button>
						</form>
					</div>
				</div>
			</div>
			<div th:if="${#lists.isEmpty(products)}" class="empty"><i class="bi bi-bag-x"></i>
				<p>No products available right now.</p>
			</div>
		</div>
	</div>
	<script>
		function filterProducts(q) {
			document.querySelectorAll('.p-card').forEach(c => {
				c.style.display = c.dataset.name?.toLowerCase().includes(q.toLowerCase()) ? '' : 'none';
			});
		}
	</script>
</body>

</html>
