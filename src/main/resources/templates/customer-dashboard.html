<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Customer Dashboard</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f5f6fa;
        }

        .sidebar {
            height: 100vh;
            background: #212529;
            padding-top: 20px;
        }

        .sidebar a {
            color: white;
            display: block;
            padding: 12px;
            text-decoration: none;
            border-radius: 8px;
            margin: 5px 10px;
        }

        .sidebar a:hover {
            background: #0d6efd;
        }

        .content {
            padding: 30px;
        }
    </style>
</head>

<body>

	<div th:if="${session.role == 'CUSTOMER'}">

	    <h4>Available Products</h4>

	    <table class="table table-bordered mt-3">
	        <thead class="table-dark">
	            <tr>
	                <th>Name</th>
	                <th>Price</th>
					<th>Image</th>
	                <th>Action</th>
					
	            </tr>
	        </thead>
			<tbody>
			    <tr th:each="product : ${products}">
			        <td th:text="${product.productName}"></td>
			        <td th:text="${product.productprice}"></td>
					<td>
					    <img th:src="@{'/product/image/' + ${product.id}}"
					         width="80" height="80"
					         class="rounded">
					</td>
			        <td>
			          <form action="/orders/buy" method="post">
			                <input type="hidden"
			                       name="productId"
			                       th:value="${product.id}" />
			                <button class="btn btn-success btn-sm">
			                    Buy
			                </button>
			            </form>
			        </td>
			    </tr>
			</tbody>
	    </table>

	</div>

</body>
</html>
