<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Product – ShopSphere</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        * {
            font-family: 'Inter', sans-serif;
        }

        body {
            background: #0f0e17;
            color: #fff;
            display: flex;
            min-height: 100vh;
            margin: 0;
        }

        .sidebar {
            width: 250px;
            min-height: 100vh;
            flex-shrink: 0;
            background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
            border-right: 1px solid rgba(255, 255, 255, 0.07);
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            left: 0;
            height: 100%;
            overflow-y: auto;
        }

        .sidebar .logo {
            font-size: 22px;
            font-weight: 800;
            color: #fff;
            padding: 8px 12px 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            margin-bottom: 20px;
        }

        .sidebar .logo span {
            color: #6c63ff;
        }

        .nav-label {
            font-size: 10px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            padding: 0 12px;
            margin: 16px 0 6px;
        }

        .sidebar a {
            display: flex;
            align-items: center;
            gap: 10px;
            color: rgba(255, 255, 255, 0.65);
            text-decoration: none;
            padding: 11px 14px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.25s;
            margin-bottom: 4px;
        }

        .sidebar a:hover,
        .sidebar a.active {
            background: rgba(108, 99, 255, 0.2);
            color: #fff;
        }

        .sidebar a i {
            font-size: 17px;
            width: 22px;
        }

        .sidebar-footer {
            margin-top: auto;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .main {
            margin-left: 250px;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .form-card {
            width: 100%;
            max-width: 540px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: 24px;
            padding: 40px;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-card h3 {
            font-weight: 800;
            font-size: 22px;
            margin-bottom: 6px;
        }

        .form-card p {
            color: rgba(255, 255, 255, 0.45);
            font-size: 13px;
            margin-bottom: 28px;
        }

        .form-label {
            color: rgba(255, 255, 255, 0.75);
            font-size: 13px;
            font-weight: 600;
        }

        .form-control {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            color: #fff;
            padding: 12px 16px;
            transition: all 0.3s;
        }

        .form-control:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: #6c63ff;
            box-shadow: 0 0 0 3px rgba(108, 99, 255, 0.2);
            color: #fff;
        }

        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.25);
        }

        textarea.form-control {
            resize: none;
        }

        .file-zone {
            border: 2px dashed rgba(255, 193, 7, 0.35);
            border-radius: 14px;
            padding: 20px;
            text-align: center;
            background: rgba(255, 193, 7, 0.05);
            cursor: pointer;
            transition: all 0.3s;
        }

        .file-zone:hover {
            border-color: #ffc107;
            background: rgba(255, 193, 7, 0.1);
        }

        .file-zone i {
            font-size: 32px;
            color: #ffc107;
            margin-bottom: 6px;
            display: block;
        }

        .file-zone p {
            margin: 0;
            color: rgba(255, 255, 255, 0.4);
            font-size: 13px;
        }

        .file-zone input {
            display: none;
        }

        .btn-update {
            background: linear-gradient(135deg, #f7971e, #ffd200);
            border: none;
            border-radius: 12px;
            padding: 13px;
            font-weight: 700;
            font-size: 15px;
            color: #111;
            width: 100%;
            transition: all 0.3s;
            box-shadow: 0 4px 20px rgba(255, 193, 7, 0.3);
        }

        .btn-update:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(255, 193, 7, 0.4);
            color: #111;
        }

        .back-link {
            color: rgba(255, 255, 255, 0.45);
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 20px;
        }

        .back-link:hover {
            color: #fff;
        }

        .divider {
            border-color: rgba(255, 255, 255, 0.08);
            margin: 20px 0;
        }
    </style>
</head>

<body>
    <div class="sidebar">
        <div class="logo">Shop<span>Sphere</span></div>
        <div class="nav-label">Seller Menu</div>
        <a href="/sellerdashboard"><i class="bi bi-grid-3x3-gap-fill"></i> My Products</a>
        <a href="/product/add"><i class="bi bi-plus-circle-fill"></i> Add Product</a>
        <a href="/orders/seller"><i class="bi bi-bag-fill"></i> My Orders</a>
        <div class="sidebar-footer">
            <a href="/logout"><i class="bi bi-box-arrow-right"></i> Logout</a>
        </div>
    </div>
    <div class="main">
        <div class="form-card">
            <a href="/product/all" class="back-link"><i class="bi bi-arrow-left"></i> Back</a>
            <h3><i class="bi bi-pencil-square me-2" style="color:#ffd200;"></i>Edit Product</h3>
            <p>Update the product details below.</p>

            <form th:action="@{/product/update}" method="post" th:object="${product}" enctype="multipart/form-data">
                <input type="hidden" th:field="*{id}">

                <div class="mb-3">
                    <label class="form-label">Product Name</label>
                    <input type="text" name="productName" th:value="*{productName}" class="form-control"
                        placeholder="Product name">
                </div>
                <div class="mb-3">
                    <label class="form-label">Product Details</label>
                    <textarea name="productdetails" class="form-control" rows="3"
                        th:text="*{productdetails}"></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label">Price (₹)</label>
                    <input type="number" step="0.01" name="productprice" th:value="*{productprice}"
                        class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">Date Added</label>
                    <input type="date" name="addproductdate" th:value="*{addproductdate}" class="form-control">
                </div>
                <div class="mb-4">
                    <label class="form-label">Update Image (optional)</label>
                    <label class="file-zone d-block">
                        <i class="bi bi-arrow-repeat"></i>
                        <p>Click to replace product image</p>
                        <input type="file" name="productimage" accept="image/*">
                    </label>
                </div>
                <button type="submit" class="btn-update"><i class="bi bi-save me-2"></i>Save Changes</button>
            </form>
        </div>
    </div>
    <script>
        document.querySelector('input[type="file"]').addEventListener('change', function () {
            if (this.files.length > 0) {
                this.closest('.file-zone').querySelector('p').textContent = '✅ ' + this.files[0].name;
            }
        });
    </script>
</body>

</html>
