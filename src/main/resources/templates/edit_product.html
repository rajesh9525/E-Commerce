<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Product – NexaMart</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --gold: #f59e0b;
            --bg: #07070f;
            --brd: rgba(255, 255, 255, 0.08);
        }

        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: #fff;
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 260px;
            min-height: 100vh;
            background: rgba(255, 255, 255, 0.02);
            border-right: 1px solid var(--brd);
            padding: 28px 16px;
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            left: 0;
            height: 100%;
            overflow-y: auto;
        }

        .brand {
            font-size: 22px;
            font-weight: 900;
            padding: 8px 14px 26px;
            border-bottom: 1px solid var(--brd);
            margin-bottom: 22px;
        }

        .brand .n {
            color: #fff;
        }

        .brand .x {
            background: linear-gradient(135deg, #7c3aed, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav-sec {
            font-size: 10px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.25);
            letter-spacing: 1.8px;
            text-transform: uppercase;
            padding: 0 14px;
            margin: 16px 0 8px;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 11px;
            color: rgba(255, 255, 255, 0.55);
            text-decoration: none;
            padding: 11px 14px;
            border-radius: 13px;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.25s;
            margin-bottom: 3px;
            border: 1px solid transparent;
        }

        .nav-link:hover,
        .nav-link.active {
            background: rgba(16, 185, 129, 0.1);
            border-color: rgba(16, 185, 129, 0.2);
            color: #6ee7b7;
        }

        .nav-link i {
            font-size: 18px;
            width: 24px;
        }

        .sidebar-foot {
            margin-top: auto;
            padding-top: 16px;
            border-top: 1px solid var(--brd);
        }

        .main {
            margin-left: 260px;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .form-card {
            width: 100%;
            max-width: 560px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--brd);
            border-radius: 26px;
            padding: 44px 40px;
            animation: up 0.5s ease-out;
            position: relative;
            overflow: hidden;
        }

        .form-card::before {
            content: '';
            position: absolute;
            top: -100px;
            right: -80px;
            width: 280px;
            height: 280px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(245, 158, 11, 0.1), transparent);
            pointer-events: none;
        }

        @keyframes up {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            color: rgba(255, 255, 255, 0.35);
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 22px;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: #fcd34d;
        }

        h3 {
            font-size: 24px;
            font-weight: 900;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sub {
            color: rgba(255, 255, 255, 0.38);
            font-size: 13px;
            margin-bottom: 30px;
        }

        .field {
            margin-bottom: 18px;
        }

        .field label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.9px;
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 7px;
        }

        .inp {
            width: 100%;
            padding: 13px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 13px;
            color: #fff;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s;
            outline: none;
        }

        .inp:focus {
            border-color: #f59e0b;
            background: rgba(245, 158, 11, 0.06);
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.1);
        }

        .inp::placeholder {
            color: rgba(255, 255, 255, 0.2);
        }

        textarea.inp {
            resize: none;
        }

        .drop-zone {
            border: 2px dashed rgba(245, 158, 11, 0.3);
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            background: rgba(245, 158, 11, 0.04);
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }

        .drop-zone:hover {
            border-color: #f59e0b;
            background: rgba(245, 158, 11, 0.08);
        }

        .drop-zone input {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
        }

        .drop-zone i {
            font-size: 36px;
            color: #fcd34d;
            margin-bottom: 8px;
            display: block;
        }

        .drop-zone p {
            color: rgba(255, 255, 255, 0.4);
            font-size: 13px;
            font-weight: 600;
        }

        .btn-update {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 14px;
            margin-top: 10px;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #111;
            font-size: 16px;
            font-weight: 900;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(245, 158, 11, 0.35);
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-update:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 45px rgba(245, 158, 11, 0.55);
        }
    </style>
</head>

<body>
    <div class="sidebar">
        <div class="brand"><span class="n">Nexa</span><span class="x">Mart</span></div>
        <div class="nav-sec">Seller</div>
        <a href="/sellerdashboard" class="nav-link"><i class="bi bi-grid-3x3-gap-fill"></i> My Products</a>
        <a href="/product/add" class="nav-link"><i class="bi bi-plus-circle-fill"></i> Add Product</a>
        <a href="/orders/seller" class="nav-link"><i class="bi bi-bag-fill"></i> Orders</a>
        <div class="sidebar-foot">
            <a href="/logout" class="nav-link" style="color:rgba(255,107,107,0.7);"><i
                    class="bi bi-box-arrow-right"></i> Logout</a>
        </div>
    </div>
    <div class="main">
        <div class="form-card">
            <a href="/product/all" class="back-link"><i class="bi bi-arrow-left-circle-fill"></i> Back</a>
            <h3><i class="bi bi-pencil-square" style="color:#fcd34d;"></i>Edit Product</h3>
            <p class="sub">Update the details for this product.</p>
            <form th:action="@{/product/update}" method="post" th:object="${product}" enctype="multipart/form-data">
                <input type="hidden" th:field="*{id}">
                <div class="field">
                    <label>Product Name</label>
                    <input type="text" name="productName" th:value="*{productName}" class="inp"
                        placeholder="Product name">
                </div>
                <div class="field">
                    <label>Details</label>
                    <textarea name="productdetails" class="inp" rows="3" th:text="*{productdetails}"></textarea>
                </div>
                <div class="field">
                    <label>Price (₹)</label>
                    <input type="number" step="0.01" name="productprice" th:value="*{productprice}" class="inp">
                </div>
                <div class="field">
                    <label>Date</label>
                    <input type="date" name="addproductdate" th:value="*{addproductdate}" class="inp">
                </div>
                <div class="field">
                    <label>Replace Image (optional)</label>
                    <div class="drop-zone">
                        <input type="file" name="productimage" accept="image/*"
                            onchange="this.nextElementSibling.nextElementSibling.textContent = '✅ ' + this.files[0].name">
                        <i class="bi bi-arrow-repeat"></i>
                        <p>Click to replace product image</p>
                    </div>
                </div>
                <button type="submit" class="btn-update"><i class="bi bi-save-fill"></i> Save Changes</button>
            </form>
        </div>
    </div>
</body>

</html>
