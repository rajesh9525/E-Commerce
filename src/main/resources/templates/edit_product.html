<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Product</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">
    <div class="card p-4 shadow">

        <h3 class="mb-4 text-warning">Edit Product</h3>

        <form th:action="@{/product/update}"
              method="post"
              th:object="${product}"
              enctype="multipart/form-data">

            <!-- Hidden ID -->
            <input type="hidden" th:field="*{id}">

            <!-- Name -->
            <div class="mb-3">
                <label>Product Name</label>
                <input type="text" th:field="*{productName}" class="form-control">
            </div>

            <!-- Details -->
            <div class="mb-3">
                <label>Product Details</label>
                <textarea th:field="*{productdetails}" class="form-control"></textarea>
            </div>

            <!-- Price -->
            <div class="mb-3">
                <label>Product Price</label>
                <input type="number" step="0.01" th:field="*{productprice}" class="form-control">
            </div>

            <!-- Date -->
            <div class="mb-3">
                <label>Product Date</label>
                <input type="date" th:field="*{addproductdate}" class="form-control">
            </div>

            <!-- Image -->
			<div class="mb-3">
			    <label>Update Image</label>
			    <input type="file" name="productimage" class="form-control">
			</div>

            <button class="btn btn-warning">Update Product</button>
            <a href="/product/view" class="btn btn-secondary">Back</a>

        </form>

    </div>
</div>

</body>
</html>
