<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>View Product</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card p-4 shadow">

        <h3 class="text-primary mb-3">Product Details</h3>

        <p><strong>ID:</strong> <span th:text="${p.id}"></span></p>
        <p><strong>Name:</strong> <span th:text="${p.productName}"></span></p>
        <p><strong>Details:</strong> <span th:text="${p.productdetails}"></span></p>
        <p><strong>Price:</strong> ₹ <span th:text="${p.productprice}"></span></p>

        <a href="/product/all" class="btn btn-secondary">Back</a>

    </div>

</div>

</body>
</html>
