<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details – NexaMart</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --y: #FFE500;
            --b: #111111;
            --g: #22C55E;
            --t: #6B7280;
            --bdr: #E5E7EB;
            --bg: #FAFAFA;
            --r: #EF4444;
        }

        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg);
            color: var(--b);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* TOP NAVBAR */
        .navbar {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid var(--bdr);
            padding: 12px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        .brand {
            font-size: 24px;
            font-weight: 900;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
        }

        .brand span {
            background: var(--y);
            padding: 2px 8px;
            border-radius: 6px;
            color: var(--b);
            margin-left: 4px;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--t);
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            transition: all 0.2s;
            cursor: pointer;
        }

        .nav-link:hover {
            background: var(--bg);
            color: var(--b);
            transform: translateY(-2px);
        }

        .nav-link.active {
            background: var(--y);
            color: var(--b);
            box-shadow: 3px 3px 0 var(--b);
            border: 2px solid var(--b);
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        /* MAIN */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .topbar {
            padding: 20px 40px;
            border-bottom: 2px solid var(--bdr);
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 90;
        }

        .topbar h5 {
            font-size: 18px;
            font-weight: 900;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--b);
        }

        .badge-role {
            background: var(--b);
            color: var(--y);
            padding: 6px 14px;
            border-radius: 8px;
            font-weight: 900;
            font-size: 12px;
            border: 2px solid var(--b);
        }

        .content {
            padding: 40px;
            display: flex;
            justify-content: center;
        }

        .p-view-card {
            width: 100%;
            max-width: 800px;
            background: #fff;
            border: 2px solid var(--b);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 8px 8px 0 var(--y);
            display: flex;
            flex-direction: column;
        }

        .img-sec {
            width: 100%;
            height: 350px;
            background: var(--bg);
            border-bottom: 2px solid var(--bdr);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .img-sec img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 20px;
        }

        .img-sec i {
            font-size: 100px;
            color: var(--bdr);
        }

        .info-sec {
            padding: 40px;
        }

        .p-head {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 20px;
        }

        .p-head h1 {
            font-size: 32px;
            font-weight: 900;
            line-height: 1.2;
            margin-bottom: 8px;
        }

        .stat-chip {
            display: inline-flex;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 800;
            border: 2px solid;
            text-transform: uppercase;
        }

        .stat-PENDING {
            background: #FEF3C7;
            color: #D97706;
            border-color: #FCD34D;
        }

        .stat-APPROVED {
            background: #D1FAE5;
            color: #059669;
            border-color: #6EE7B7;
        }

        .stat-REJECTED {
            background: #FEE2E2;
            color: #DC2626;
            border-color: #FCA5A5;
        }

        .price {
            font-size: 40px;
            font-weight: 900;
            color: var(--g);
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .price span {
            font-size: 14px;
            color: var(--t);
            text-decoration: line-through;
            font-weight: 700;
        }

        .lbl {
            font-size: 12px;
            font-weight: 800;
            color: var(--t);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .desc {
            font-size: 15px;
            color: var(--b);
            line-height: 1.7;
            background: var(--bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--bdr);
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <div class="brand">Nexa<span>Mart</span></div>
        <div class="nav-links">
            <a href="/admin/dashboard" class="nav-link"><i class="bi bi-people-fill"></i> Users</a>
            <a href="/admin/product-requests" class="nav-link"><i class="bi bi-box-seam-fill"></i> Requests</a>
            <a href="/product/view/all" class="nav-link active"><i class="bi bi-pencil-square"></i> Inventory</a>
        </div>
        <div class="nav-actions">
            <div class="badge-role">ADMIN 🛡️</div>
            <a href="/logout" class="nav-link"
                style="color:var(--r); border:2px solid var(--r); background:transparent;"><i
                    class="bi bi-box-arrow-right"></i> Sign Out</a>
        </div>
    </nav>

    <div class="main">
        <div class="content">
            <h5 style="margin-bottom:20px;"><a href="/product/view/all" style="color:var(--t);text-decoration:none;"><i
                        class="bi bi-arrow-left"></i> Back to Inventory</a></h5>
            <div class="p-view-card">
                <div class="img-sec">
                    <img th:if="${p.productimage != null}" th:src="@{'/product/image/' + ${p.id}}">
                    <i th:unless="${p.productimage != null}" class="bi bi-image"></i>
                </div>
                <div class="info-sec">
                    <div class="p-head">
                        <h1><span th:text="${p.productName}"></span></h1>
                        <span th:class="'stat-chip stat-' + ${p.status}" th:text="${p.status}"></span>
                    </div>

                    <div class="price">
                        <span th:text="'₹' + (${p.productprice} * 1.5)"></span>
                        ₹<span th:text="${p.productprice}"></span>
                    </div>

                    <div class="lbl">Product Description</div>
                    <div class="desc" th:text="${p.productdetails}"></div>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
