<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Detail – NexaMart</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #07070f;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .detail {
            width: 100%;
            max-width: 560px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            overflow: hidden;
            animation: up 0.5s ease-out;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
        }

        @keyframes up {
            from {
                opacity: 0;
                transform: translateY(24px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .detail img {
            width: 100%;
            height: 280px;
            object-fit: cover;
        }

        .detail .no-img {
            width: 100%;
            height: 280px;
            background: rgba(255, 255, 255, 0.03);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .detail .no-img i {
            font-size: 72px;
            color: rgba(255, 255, 255, 0.08);
        }

        .body {
            padding: 32px;
        }

        .brand {
            font-size: 14px;
            font-weight: 900;
            margin-bottom: 20px;
        }

        .brand .n {
            color: #fff;
        }

        .brand .x {
            background: linear-gradient(135deg, #7c3aed, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        h3 {
            font-size: 26px;
            font-weight: 900;
            margin-bottom: 8px;
        }

        .price {
            font-size: 32px;
            font-weight: 900;
            color: #6ee7b7;
            margin: 14px 0 24px;
        }

        hr {
            border: none;
            border-top: 1px solid rgba(255, 255, 255, 0.07);
            margin: 20px 0;
        }

        .meta {
            display: grid;
            gap: 16px;
        }

        .meta-item label {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.3);
            display: block;
            margin-bottom: 5px;
        }

        .meta-item span {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.75);
        }

        .chip {
            display: inline-block;
            padding: 5px 14px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 700;
        }

        .chip-pending {
            background: rgba(245, 158, 11, 0.12);
            color: #fcd34d;
            border: 1px solid rgba(245, 158, 11, 0.25);
        }

        .chip-approved {
            background: rgba(16, 185, 129, 0.12);
            color: #6ee7b7;
            border: 1px solid rgba(16, 185, 129, 0.25);
        }

        .chip-rejected {
            background: rgba(239, 68, 68, 0.12);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.25);
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 22px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            transition: all 0.2s;
            margin-top: 24px;
        }

        .btn-back:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }
    </style>
</head>

<body>
    <div class="detail">
        <img th:if="${p.productimage != null}" th:src="@{'/product/image/' + ${p.id}}" alt="Product">
        <div th:unless="${p.productimage != null}" class="no-img"><i class="bi bi-image"></i></div>
        <div class="body">
            <div class="brand"><span class="n">Nexa</span><span class="x">Mart</span></div>
            <h3 th:text="${p.productName}">Product Name</h3>
            <div class="price" th:text="'₹' + ${p.productprice}">₹0</div>
            <hr>
            <div class="meta">
                <div class="meta-item">
                    <label>Description</label>
                    <span th:text="${p.productdetails}">—</span>
                </div>
                <div class="meta-item">
                    <label>Product ID</label>
                    <span style="color:#a78bfa;font-weight:700;" th:text="'#' + ${p.id}">—</span>
                </div>
                <div class="meta-item">
                    <label>Approval Status</label>
                    <span th:if="${p.status == 'PENDING'}" class="chip chip-pending">PENDING</span>
                    <span th:if="${p.status == 'APPROVED'}" class="chip chip-approved">APPROVED</span>
                    <span th:if="${p.status == 'REJECTED'}" class="chip chip-rejected">REJECTED</span>
                </div>
            </div>
            <a href="/sellerdashboard" class="btn-back"><i class="bi bi-arrow-left-circle-fill"></i> Back to
                Dashboard</a>
        </div>
    </div>
</body>

</html>
