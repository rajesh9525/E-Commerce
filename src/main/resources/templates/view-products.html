<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Products – NexaMart</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --p: #7c3aed;
            --bg: #07070f;
            --brd: rgba(255, 255, 255, 0.08);
        }

        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: #fff;
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 260px;
            min-height: 100vh;
            background: rgba(255, 255, 255, 0.02);
            border-right: 1px solid var(--brd);
            padding: 28px 16px;
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            left: 0;
            height: 100%;
            overflow-y: auto;
        }

        .brand {
            font-size: 22px;
            font-weight: 900;
            padding: 8px 14px 26px;
            border-bottom: 1px solid var(--brd);
            margin-bottom: 22px;
        }

        .brand .n {
            color: #fff;
        }

        .brand .x {
            background: linear-gradient(135deg, #7c3aed, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav-sec {
            font-size: 10px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.25);
            letter-spacing: 1.8px;
            text-transform: uppercase;
            padding: 0 14px;
            margin: 16px 0 8px;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 11px;
            color: rgba(255, 255, 255, 0.55);
            text-decoration: none;
            padding: 11px 14px;
            border-radius: 13px;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.25s;
            margin-bottom: 3px;
            border: 1px solid transparent;
        }

        .nav-link:hover,
        .nav-link.active {
            background: rgba(16, 185, 129, 0.1);
            border-color: rgba(16, 185, 129, 0.2);
            color: #6ee7b7;
        }

        .nav-link i {
            font-size: 18px;
            width: 24px;
        }

        .sidebar-foot {
            margin-top: auto;
            padding-top: 16px;
            border-top: 1px solid var(--brd);
        }

        .main {
            margin-left: 260px;
            flex: 1;
        }

        .topbar {
            padding: 20px 36px;
            border-bottom: 1px solid var(--brd);
            background: rgba(255, 255, 255, 0.02);
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 10;
            backdrop-filter: blur(20px);
        }

        .topbar h5 {
            font-size: 18px;
            font-weight: 800;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .content {
            padding: 32px 36px;
        }

        .page-banner {
            background: linear-gradient(135deg, rgba(124, 58, 237, 0.1), rgba(16, 185, 129, 0.05));
            border: 1px solid rgba(124, 58, 237, 0.2);
            border-radius: 22px;
            padding: 28px 32px;
            margin-bottom: 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .page-banner h4 {
            font-size: 22px;
            font-weight: 900;
            margin-bottom: 4px;
        }

        .page-banner p {
            color: rgba(255, 255, 255, 0.4);
            font-size: 13px;
            margin: 0;
        }

        .btn-add {
            padding: 12px 26px;
            border-radius: 13px;
            background: linear-gradient(135deg, #7c3aed, #5b21b6);
            border: none;
            color: #fff;
            font-weight: 800;
            font-size: 14px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(124, 58, 237, 0.3);
            transition: all 0.3s;
        }

        .btn-add:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 35px rgba(124, 58, 237, 0.5);
            color: #fff;
        }

        .table-wrap {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--brd);
            border-radius: 20px;
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead th {
            background: rgba(124, 58, 237, 0.07);
            color: rgba(255, 255, 255, 0.45);
            font-size: 10.5px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 14px 18px;
            border-bottom: 1px solid var(--brd);
        }

        tbody tr {
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            transition: background 0.2s;
        }

        tbody tr:hover {
            background: rgba(255, 255, 255, 0.025);
        }

        tbody tr:last-child {
            border-bottom: none;
        }

        td {
            padding: 15px 18px;
            font-size: 14px;
            vertical-align: middle;
        }

        .pimg {
            width: 56px;
            height: 56px;
            object-fit: cover;
            border-radius: 12px;
            border: 1px solid var(--brd);
        }

        .btn-view {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 7px 15px;
            border-radius: 10px;
            background: rgba(124, 58, 237, 0.12);
            border: 1px solid rgba(124, 58, 237, 0.25);
            color: #c4b5fd;
            font-size: 12px;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.2s;
        }

        .btn-view:hover {
            background: rgba(124, 58, 237, 0.25);
            color: #fff;
        }

        .empty {
            text-align: center;
            padding: 60px;
            color: rgba(255, 255, 255, 0.2);
        }

        .empty i {
            font-size: 56px;
            display: block;
            margin-bottom: 14px;
        }
    </style>
</head>

<body>
    <div class="sidebar">
        <div class="brand"><span class="n">Nexa</span><span class="x">Mart</span></div>
        <div class="nav-sec">Seller</div>
        <a href="/sellerdashboard" class="nav-link active"><i class="bi bi-grid-3x3-gap-fill"></i> All Products</a>
        <a href="/product/add" class="nav-link"><i class="bi bi-plus-circle-fill"></i> Add Product</a>
        <a href="/orders/seller" class="nav-link"><i class="bi bi-bag-fill"></i> Orders</a>
        <div class="sidebar-foot">
            <a href="/logout" class="nav-link" style="color:rgba(255,107,107,0.7);"><i
                    class="bi bi-box-arrow-right"></i> Logout</a>
        </div>
    </div>
    <div class="main">
        <div class="topbar">
            <h5><i class="bi bi-boxes" style="color:#a78bfa;"></i>Product Catalogue</h5>
        </div>
        <div class="content">
            <div class="page-banner">
                <div>
                    <h4>All Products</h4>
                    <p>Complete product listing in the system</p>
                </div>
                <a href="/product/add" class="btn-add"><i class="bi bi-plus-lg"></i> Add Product</a>
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Name</th>
                            <th>Details</th>
                            <th>Price</th>
                            <th>Image</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(products)}">
                            <td colspan="6">
                                <div class="empty"><i class="bi bi-box-seam"></i>
                                    <p>No products found</p>
                                </div>
                            </td>
                        </tr>
                        <tr th:each="p : ${products}">
                            <td style="color:rgba(255,255,255,0.3);font-size:13px;" th:text="${p.id}"></td>
                            <td><strong th:text="${p.productName}"></strong></td>
                            <td style="color:rgba(255,255,255,0.4);font-size:13px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"
                                th:text="${p.productdetails}"></td>
                            <td style="color:#6ee7b7;font-weight:800;" th:text="'₹' + ${p.productprice}"></td>
                            <td>
                                <img th:if="${p.productimage != null}" th:src="@{'/product/image/' + ${p.id}}"
                                    class="pimg" alt="img">
                                <span th:unless="${p.productimage != null}"
                                    style="color:rgba(255,255,255,0.2);font-size:12px;">—</span>
                            </td>
                            <td><a th:href="@{'/product/view/' + ${p.id}}" class="btn-view"><i
                                        class="bi bi-eye-fill"></i> View</a></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>

</html>
