<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Inventory – NexaMart</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --y: #FFE500;
            --b: #111111;
            --g: #22C55E;
            --t: #6B7280;
            --bdr: #E5E7EB;
            --bg: #FAFAFA;
            --r: #EF4444;
        }

        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg);
            color: var(--b);
            display: flex;
            min-height: 100vh;
        }

        /* SIDEBAR */
        .sidebar {
            width: 260px;
            min-height: 100vh;
            background: #fff;
            border-right: 2px solid var(--bdr);
            padding: 28px 20px;
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            left: 0;
            height: 100%;
            z-index: 100;
        }

        .brand {
            font-size: 24px;
            font-weight: 900;
            padding: 8px 10px 26px;
            border-bottom: 2px solid var(--bdr);
            margin-bottom: 22px;
        }

        .brand span {
            background: var(--y);
            padding: 2px 8px;
            border-radius: 6px;
            color: var(--b);
        }

        .nav-sec {
            font-size: 11px;
            font-weight: 800;
            color: var(--t);
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 0 10px;
            margin: 16px 0 8px;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--t);
            text-decoration: none;
            padding: 12px 14px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            transition: all 0.2s;
            margin-bottom: 4px;
        }

        .nav-link:hover {
            background: var(--bg);
            color: var(--b);
        }

        .nav-link.active {
            background: var(--y);
            color: var(--b);
            box-shadow: 4px 4px 0 var(--b);
            border: 2px solid var(--b);
        }

        .nav-link i {
            font-size: 18px;
        }

        .sidebar-foot {
            margin-top: auto;
            padding-top: 16px;
            border-top: 2px solid var(--bdr);
        }

        /* MAIN */
        .main {
            margin-left: 260px;
            flex: 1;
        }

        .topbar {
            padding: 20px 40px;
            border-bottom: 2px solid var(--bdr);
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 90;
        }

        .topbar h5 {
            font-size: 18px;
            font-weight: 900;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--b);
        }

        .badge-role {
            background: var(--b);
            color: var(--y);
            padding: 6px 14px;
            border-radius: 8px;
            font-weight: 900;
            font-size: 12px;
            border: 2px solid var(--b);
        }

        .content {
            padding: 40px;
        }

        .page-banner {
            background: #fff;
            border: 2px solid var(--b);
            border-radius: 20px;
            padding: 28px 40px;
            margin-bottom: 32px;
            box-shadow: 8px 8px 0 var(--y);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-image: radial-gradient(var(--bdr) 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .page-banner h4 {
            font-size: 28px;
            font-weight: 900;
            margin-bottom: 4px;
            background: #fff;
            display: inline-block;
            padding-right: 10px;
        }

        .page-banner p {
            color: var(--t);
            font-size: 14px;
            font-weight: 600;
            background: #fff;
            display: inline-block;
            padding-right: 10px;
        }

        /* TABLE */
        .table-wrap {
            background: #fff;
            border: 2px solid var(--bdr);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.03);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead th {
            background: var(--bg);
            color: var(--t);
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 16px 20px;
            border-bottom: 2px solid var(--bdr);
            text-align: left;
        }

        tbody tr {
            border-bottom: 1px solid var(--bdr);
            transition: background 0.2s;
        }

        tbody tr:hover {
            background: var(--bg);
        }

        tbody tr:last-child {
            border-bottom: none;
        }

        td {
            padding: 16px 20px;
            font-size: 14px;
            vertical-align: middle;
            font-weight: 600;
            color: var(--b);
        }

        .pimg {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            object-fit: cover;
            border: 2px solid var(--bdr);
        }

        .stat-chip {
            display: inline-flex;
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 800;
            border: 2px solid;
            align-items: center;
            gap: 4px;
        }

        .stat-PENDING {
            background: #FEF3C7;
            color: #D97706;
            border-color: #FCD34D;
        }

        .stat-APPROVED {
            background: #D1FAE5;
            color: #059669;
            border-color: #6EE7B7;
        }

        .stat-REJECTED {
            background: #FEE2E2;
            color: #DC2626;
            border-color: #FCA5A5;
        }

        .btn-act {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 800;
            text-decoration: none;
            border: 2px solid var(--bdr);
            background: #fff;
            color: var(--b);
            transition: all 0.2s;
        }

        .btn-act:hover {
            border-color: var(--b);
            box-shadow: 3px 3px 0 var(--y);
            transform: translateY(-2px);
        }

        .btn-act.red:hover {
            box-shadow: 3px 3px 0 var(--r);
        }

        .empty {
            text-align: center;
            padding: 60px 20px;
            color: var(--t);
        }

        .empty i {
            font-size: 48px;
            color: var(--bdr);
            margin-bottom: 16px;
        }

        .empty p {
            font-weight: 700;
        }
    </style>
</head>

<body>

    <div class="sidebar">
        <div class="brand">Nexa<span>Mart</span></div>
        <div class="nav-sec">Admin Hub</div>
        <a href="/admin/dashboard" class="nav-link"><i class="bi bi-people-fill"></i> Users</a>
        <a href="/admin/product-requests" class="nav-link"><i class="bi bi-box-seam-fill"></i> Requests</a>
        <a href="/product/view/all" class="nav-link active"><i class="bi bi-pencil-square"></i> Inventory</a>
        <div class="sidebar-foot">
            <a href="/logout" class="nav-link" style="color:var(--r);"><i class="bi bi-box-arrow-right"></i> Sign
                Out</a>
        </div>
    </div>

    <div class="main">
        <div class="topbar">
            <h5>Full Inventory</h5>
            <div class="badge-role">ADMIN 🛡️</div>
        </div>

        <div class="content">
            <div class="page-banner">
                <div>
                    <h4>All Listed Products 🏷️</h4>
                    <p>Manage, view or delete live items</p>
                </div>
            </div>

            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Details</th>
                            <th>Price</th>
                            <th>Image</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(p)}">
                            <td colspan="6">
                                <div class="empty"><i class="bi bi-box-seam"></i>
                                    <p>No products in the system.</p>
                                </div>
                            </td>
                        </tr>
                        <tr th:each="p1 : ${p}">
                            <td th:text="${p1.productName}" style="font-weight:800;"></td>
                            <td th:text="${p1.productdetails}"
                                style="color:var(--t);font-size:12px;max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">
                            </td>
                            <td th:text="'₹' + ${p1.productprice}" style="color:var(--g);font-weight:800;"></td>
                            <td>
                                <img th:if="${p1.productimage != null}" th:src="@{'/product/image/' + ${p1.id}}"
                                    class="pimg">
                                <span th:unless="${p1.productimage != null}" style="color:var(--bdr);font-size:12px;">No
                                    img</span>
                            </td>
                            <td><span th:class="'stat-chip stat-' + ${p1.status}" th:text="${p1.status}"></span></td>
                            <td style="display:flex;gap:8px;">
                                <a class="btn-act" th:href="@{/product/view/{id}(id=${p1.id})}"><i
                                        class="bi bi-eye"></i> View</a>
                                <a class="btn-act" th:href="@{/product/edit/{id}(id=${p1.id})}"><i
                                        class="bi bi-pencil"></i> Edit</a>
                                <a class="btn-act red" th:href="@{/product/delete/{id}(id=${p1.id})}"><i
                                        class="bi bi-trash"></i> Delete</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</body>

</html>
