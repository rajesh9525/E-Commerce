<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>View Products</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="text-primary">All Products</h2>
        <a href="/product/add" class="btn btn-success">Add Product</a>
    </div>

    <div class="card shadow p-4">

        <table class="table table-bordered table-striped">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Details</th>
                    <th>Price</th>
					<th>Image</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody>
                <tr th:each="p : ${products}">
                    <td th:text="${p.id}"></td>
                    <td th:text="${p.productName}"></td>
                    <td th:text="${p.productdetails}"></td>
                    <td th:text="${p.productprice}"></td>
					<td>
					    <img th:src="@{'/product/image/' + ${p.id}}"
					         width="80" height="80"
					         class="rounded">
					</td>
                    <td>
                        <a th:href="@{'/product/view/' + ${p.id}}" 
                           class="btn btn-info btn-sm">View</a>                       
                    </td>
                </tr>
            </tbody>
        </table>

    </div>

</div>

</body>
</html>
