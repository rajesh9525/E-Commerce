<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            display: flex;
            background-color: #f4f6f9;
        }

        /* Sidebar */
        .sidebar {
            width: 240px;
            height: 100vh;
            background: linear-gradient(180deg,#343a40,#212529);
            color: white;
            padding: 20px;
            position: fixed;
        }

        .sidebar h4 {
            text-align: center;
            margin-bottom: 30px;
        }

        .sidebar a {
            display: block;
            color: white;
            padding: 12px;
            text-decoration: none;
            margin-bottom: 10px;
            border-radius: 8px;
            transition: 0.3s;
        }

        .sidebar a:hover {
            background: #0d6efd;
        }

        /* Main Content */
        .content {
            margin-left: 260px;
            padding: 30px;
            width: 100%;
        }

        .card-box {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.08);
            margin-bottom: 30px;
        }

        table {
            background: white;
        }

        th {
            background-color: #0d6efd;
            color: white;
        }
    </style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
    <h4>Admin Panel</h4>
	<a href="#" onclick="showSection('users')">Manage Users</a>
	<a href="#" onclick="showSection('products')">Seller Products</a>
	<a href="#" onclick="showSection('activity')">User Activity</a>
</div>

<!-- CONTENT -->
<div class="content">

    <!-- USERS -->
   <div class="card-box section" id="users">
        <h4 class="mb-3">Manage Users</h4>

        <table class="table table-bordered table-hover">
            <thead>
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Role</th>
                <th>Login Date</th>
                <th>Action</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="u : ${users}">
                <td th:text="${u.name}"></td>
                <td th:text="${u.email}"></td>
                <td th:text="${u.logintype}"></td>
                <td th:text="${u.logindate}"></td>

                <td>
                    <a class="btn btn-warning btn-sm"
                       th:href="@{/admin/block/{id}(id=${u.id})}">
                        Block
                    </a>

                    <a class="btn btn-danger btn-sm"
                       th:href="@{/admin/delete/{id}(id=${u.id})}">
                        Delete
                    </a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- PRODUCT REQUEST -->
   <div class="card-box section" id="products">
        <h4 class="mb-3">Seller Product Requests</h4>

        <table class="table table-bordered table-hover">
            <thead>
            <tr>
                <th>Product Name</th>
                <th>Seller</th>
				<th>Image</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="req : ${requests}">
                <td th:text="${req.productname}"></td>
                <td th:text="${req.sellername}"></td>
				<td>
				    <img th:if="${req.productimage != null}"
				         th:src="@{'/request/image/' + ${req.id}}"
				         width="80"
				         class="rounded">
				    <span th:unless="${req.productimage != null}" class="text-muted small">No image</span>
				</td>
                <td th:text="${req.status}"></td>
				<td>
				    <a class="btn btn-success btn-sm"
				       th:href="@{/admin/approve-product/{id}(id=${req.id})}">
				        Approve
				    </a>

				    <a class="btn btn-danger btn-sm"
				       th:href="@{/admin/reject-product/{id}(id=${req.id})}">
				        Reject
				    </a>
				</td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- ACTIVITY -->
   <div class="card-box section" id="activity">
        <h4 class="mb-3">User Activity</h4>

        <table class="table table-bordered table-hover">
            <thead>
            <tr>
                <th>Name</th>
                <th>Action</th>
                <th>Time</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="a : ${activity}">
                <td th:text="${a.name}"></td>
                <td th:text="${a.action}"></td>
                <td th:text="${a.time}"></td>
            </tr>
            </tbody>
        </table>
    </div>

</div>
<script>
    function showSection(id) {

        let sections = document.querySelectorAll(".section");

        sections.forEach(function(section) {
            section.style.display = "none";
        });

        document.getElementById(id).style.display = "block";
    }

    // Show Users section by default
    window.onload = function() {
        showSection("users");
    }
</script>
</body>
</html>
