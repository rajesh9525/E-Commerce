<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delivery Orders – NexaMart</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --y: #FFE500;
            --b: #111111;
            --g: #22C55E;
            --t: #6B7280;
            --bdr: #E5E7EB;
            --bg: #FAFAFA;
            --r: #EF4444;
        }

        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg);
            color: var(--b);
            display: flex;
            min-height: 100vh;
        }

        /* SIDEBAR */
        .sidebar {
            width: 260px;
            min-height: 100vh;
            background: #fff;
            border-right: 2px solid var(--bdr);
            padding: 28px 20px;
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            left: 0;
            height: 100%;
            z-index: 100;
        }

        .brand {
            font-size: 24px;
            font-weight: 900;
            padding: 8px 10px 26px;
            border-bottom: 2px solid var(--bdr);
            margin-bottom: 22px;
        }

        .brand span {
            background: var(--y);
            padding: 2px 8px;
            border-radius: 6px;
            color: var(--b);
        }

        .nav-sec {
            font-size: 11px;
            font-weight: 800;
            color: var(--t);
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 0 10px;
            margin: 16px 0 8px;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--t);
            text-decoration: none;
            padding: 12px 14px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            transition: all 0.2s;
            margin-bottom: 4px;
        }

        .nav-link:hover {
            background: var(--bg);
            color: var(--b);
        }

        .nav-link.active {
            background: var(--y);
            color: var(--b);
            box-shadow: 4px 4px 0 var(--b);
            border: 2px solid var(--b);
        }

        .nav-link i {
            font-size: 18px;
        }

        .sidebar-foot {
            margin-top: auto;
            padding-top: 16px;
            border-top: 2px solid var(--bdr);
        }

        /* MAIN */
        .main {
            margin-left: 260px;
            flex: 1;
        }

        .topbar {
            padding: 20px 40px;
            border-bottom: 2px solid var(--bdr);
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 90;
        }

        .topbar h5 {
            font-size: 18px;
            font-weight: 900;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--b);
        }

        .badge-role {
            background: var(--b);
            color: var(--y);
            padding: 6px 14px;
            border-radius: 8px;
            font-weight: 900;
            font-size: 12px;
            border: 2px solid var(--b);
        }

        .content {
            padding: 40px;
        }

        .page-banner {
            background: #fff;
            border: 2px solid var(--b);
            border-radius: 20px;
            padding: 28px 40px;
            margin-bottom: 32px;
            box-shadow: 8px 8px 0 var(--y);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-image: radial-gradient(var(--bdr) 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .page-banner h4 {
            font-size: 28px;
            font-weight: 900;
            margin-bottom: 4px;
            background: #fff;
            display: inline-block;
            padding-right: 10px;
        }

        .page-banner p {
            color: var(--t);
            font-size: 14px;
            font-weight: 600;
            background: #fff;
            display: inline-block;
            padding-right: 10px;
        }

        /* TABLE */
        .table-wrap {
            background: #fff;
            border: 2px solid var(--bdr);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.03);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead th {
            background: var(--bg);
            color: var(--t);
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 16px 20px;
            border-bottom: 2px solid var(--bdr);
            text-align: left;
        }

        tbody tr {
            border-bottom: 1px solid var(--bdr);
            transition: background 0.2s;
        }

        tbody tr:hover {
            background: var(--bg);
        }

        tbody tr:last-child {
            border-bottom: none;
        }

        td {
            padding: 16px 20px;
            font-size: 14px;
            vertical-align: middle;
            font-weight: 600;
        }

        .stat-chip {
            display: inline-flex;
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 800;
            border: 2px solid;
            align-items: center;
            gap: 4px;
            text-transform: uppercase;
        }

        .stat-Ordered {
            background: #DBEAFE;
            color: #2563EB;
            border-color: #BFDBFE;
        }

        .stat-Dispatched {
            background: #FEF3C7;
            color: #D97706;
            border-color: #FCD34D;
        }

        .stat-Delivered {
            background: #D1FAE5;
            color: #059669;
            border-color: #6EE7B7;
        }

        .empty {
            text-align: center;
            padding: 60px 20px;
            color: var(--t);
        }

        .empty i {
            font-size: 48px;
            color: var(--bdr);
            margin-bottom: 16px;
        }

        .empty p {
            font-weight: 700;
        }

        .p-block {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .p-name {
            font-weight: 800;
            color: var(--b);
        }

        .p-dt {
            font-size: 12px;
            color: var(--t);
        }

        .btn-act {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 800;
            text-decoration: none;
            border: 2px solid var(--bdr);
            background: #fff;
            color: var(--b);
            transition: all 0.2s;
        }

        .btn-act:hover {
            border-color: var(--b);
            box-shadow: 3px 3px 0 var(--y);
            transform: translateY(-2px);
        }

        .btn-act.tms {
            border-color: var(--y);
            background: var(--y);
            box-shadow: 3px 3px 0 var(--b);
        }

        .btn-act.tms:hover {
            background: var(--b);
            color: #fff;
        }
    </style>
</head>

<body>

    <div class="sidebar">
        <div class="brand">Nexa<span>Mart</span></div>
        <div class="nav-sec">Delivery</div>
        <a href="/delivery/orders" class="nav-link active"><i class="bi bi-truck"></i> My Deliveries</a>
        <a href="/delivery/status" class="nav-link"><i class="bi bi-clipboard-check"></i> Status Update</a>
        <div class="sidebar-foot">
            <a href="/logout" class="nav-link" style="color:var(--r);"><i class="bi bi-box-arrow-right"></i> Sign
                Out</a>
        </div>
    </div>

    <div class="main">
        <div class="topbar">
            <h5>Delivery Hub</h5>
            <div class="badge-role">DELIVERY 🚚</div>
        </div>

        <div class="content">
            <div class="page-banner">
                <div>
                    <h4>Your Deliveries 📦</h4>
                    <p>View all orders assigned to you for dispatch.</p>
                </div>
                <a href="/delivery/status" class="btn-act tms"><i class="bi bi-arrow-right"></i> Update Status</a>
            </div>

            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Order ID</th>
                            <th>Product</th>
                            <th>Customer / Area</th>
                            <th>Amount</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(orders)}">
                            <td colspan="5">
                                <div class="empty"><i class="bi bi-truck-flatbed"></i>
                                    <p>No deliveries assigned currently.</p>
                                </div>
                            </td>
                        </tr>
                        <tr th:each="o : ${orders}">
                            <td style="font-family:monospace;font-weight:700;" th:text="'#' + ${o.id}"></td>

                            <td>
                                <div class="p-block">
                                    <span class="p-name" th:text="${o.product.productName}"></span>
                                    <span class="p-dt" th:text="${o.orderDate}"></span>
                                </div>
                            </td>

                            <td>
                                <div class="p-block">
                                    <span class="p-name" th:text="${o.customerName}"></span>
                                    <div style="display:flex;align-items:center;gap:4px;font-size:12px;color:var(--t);">
                                        <i class="bi bi-geo-alt-fill"></i> <span th:text="${o.city}"></span></div>
                                </div>
                            </td>

                            <td th:text="'₹' + ${o.totalAmount}" style="color:var(--g);font-weight:800;"></td>
                            <td><span th:class="'stat-chip stat-' + ${o.status}" th:text="${o.status}"></span></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</body>

</html>
