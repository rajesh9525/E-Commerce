<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delivery Orders – ShopSphere</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        * {
            font-family: 'Inter', sans-serif;
        }

        body {
            background: #0f0e17;
            color: #fff;
            display: flex;
            min-height: 100vh;
            margin: 0;
        }

        .sidebar {
            width: 250px;
            min-height: 100vh;
            flex-shrink: 0;
            background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
            border-right: 1px solid rgba(255, 255, 255, 0.07);
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            left: 0;
            height: 100%;
            overflow-y: auto;
        }

        .sidebar .logo {
            font-size: 22px;
            font-weight: 800;
            color: #fff;
            padding: 8px 12px 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            margin-bottom: 20px;
        }

        .sidebar .logo span {
            color: #6c63ff;
        }

        .nav-label {
            font-size: 10px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            padding: 0 12px;
            margin: 16px 0 6px;
        }

        .sidebar a {
            display: flex;
            align-items: center;
            gap: 10px;
            color: rgba(255, 255, 255, 0.65);
            text-decoration: none;
            padding: 11px 14px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.25s;
            margin-bottom: 4px;
        }

        .sidebar a:hover,
        .sidebar a.active {
            background: rgba(108, 99, 255, 0.2);
            color: #fff;
        }

        .sidebar a i {
            font-size: 17px;
            width: 22px;
        }

        .sidebar-footer {
            margin-top: auto;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .main {
            margin-left: 250px;
            flex: 1;
        }

        .topbar {
            background: rgba(255, 255, 255, 0.04);
            border-bottom: 1px solid rgba(255, 255, 255, 0.07);
            padding: 18px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .topbar h5 {
            margin: 0;
            font-weight: 700;
            font-size: 18px;
        }

        .delivery-badge {
            background: linear-gradient(135deg, #1e90ff, #00cfdd);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            color: #111;
        }

        .content-area {
            padding: 28px 32px;
        }

        .page-header {
            background: linear-gradient(135deg, rgba(30, 144, 255, 0.12), rgba(0, 207, 221, 0.06));
            border: 1px solid rgba(30, 144, 255, 0.2);
            border-radius: 18px;
            padding: 24px 28px;
            margin-bottom: 24px;
        }

        .page-header h4 {
            margin: 0;
            font-weight: 800;
        }

        .page-header p {
            margin: 4px 0 0;
            color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
        }

        .card-table {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 18px;
            overflow: hidden;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
        }

        .data-table thead th {
            background: rgba(30, 144, 255, 0.1);
            color: rgba(255, 255, 255, 0.6);
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            padding: 14px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.07);
        }

        .data-table tbody tr {
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: background 0.2s;
        }

        .data-table tbody tr:hover {
            background: rgba(255, 255, 255, 0.04);
        }

        .data-table td {
            padding: 14px 16px;
            font-size: 14px;
            vertical-align: middle;
        }

        .empty-state {
            text-align: center;
            padding: 48px;
            color: rgba(255, 255, 255, 0.25);
        }

        .empty-state i {
            font-size: 48px;
            margin-bottom: 12px;
            display: block;
        }
    </style>
</head>

<body>
    <div class="sidebar">
        <div class="logo">Shop<span>Sphere</span></div>
        <div class="nav-label">Delivery</div>
        <a href="/delivery/orders" class="active"><i class="bi bi-truck"></i> My Orders</a>
        <a href="/delivery/status"><i class="bi bi-clipboard-check"></i> Status</a>
        <div class="sidebar-footer">
            <a href="/logout"><i class="bi bi-box-arrow-right"></i> Logout</a>
        </div>
    </div>
    <div class="main">
        <div class="topbar">
            <h5><i class="bi bi-truck me-2" style="color:#1e90ff;"></i>Delivery Orders</h5>
            <span class="delivery-badge"><i class="bi bi-truck me-1"></i>DELIVERY</span>
        </div>
        <div class="content-area">
            <div class="page-header">
                <h4>Assigned Orders</h4>
                <p>Orders assigned to you for delivery</p>
            </div>
            <div class="card-table">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Order ID</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(orders)}">
                            <td colspan="2">
                                <div class="empty-state"><i class="bi bi-truck"></i>
                                    <p>No orders assigned yet</p>
                                </div>
                            </td>
                        </tr>
                        <tr th:each="o : ${orders}">
                            <td><b>#<span th:text="${o.id}"></span></b></td>
                            <td><span th:text="${o.status}" style="color:rgba(255,255,255,0.65);"></span></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>

</html>
