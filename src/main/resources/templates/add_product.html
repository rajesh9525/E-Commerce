<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Product</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background: linear-gradient(135deg,#0d6efd,#6610f2);
            height: 100vh;
            display:flex;
            align-items:center;
            justify-content:center;
        }

        .card-box{
            width: 500px;
            border-radius: 20px;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.2);
        }

        .card-header{
            border-radius: 20px 20px 0 0 !important;
            font-weight: bold;
            font-size: 20px;
        }

        .form-control{
            border-radius: 10px;
        }

        .btn-save{
            border-radius: 10px;
            font-weight: 600;
        }
    </style>

</head>
<body>

<div class="card card-box">

    <div class="card-header bg-primary text-white text-center">
        Add New Product
    </div>

    <div class="card-body p-4">

        <form action="/request" method="post" enctype="multipart/form-data">

            <div class="mb-3">
                <label class="form-label">Seller Name</label>
                <input type="text" name="sellername" class="form-control" placeholder="Enter your name" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Product Name</label>
                <input type="text" name="productname" class="form-control" placeholder="Enter product name" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Product Details</label>
                <textarea name="productdetails" class="form-control" rows="3" placeholder="Enter product details" required></textarea>
            </div>

            <div class="mb-3">
                <label class="form-label">Product Price</label>
                <input type="number" step="0.01" name="productprice" class="form-control" placeholder="Enter price" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Product Image</label>
				<input type="file" name="file" class="form-control" required>
            </div>

            <button type="submit" class="btn btn-success w-100 btn-save">
                Save Product
            </button>

        </form>

    </div>

</div>

</body>
</html>
