<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Seller Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container mt-5">

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="text-primary">Seller Dashboard</h2>
            <form action="/logout" method="get">
                <button class="btn btn-danger">Logout</button>
            </form>
        </div>

        <div class="card shadow-sm p-3 mb-3">
            <div class="row g-3">
                <div class="col-md-3">
                    <a href="/product/add" class="btn btn-success w-100">Add Product</a>
                </div>
                <div class="col-md-3">
                    <a href="/orders/seller" class="btn btn-warning w-100">View Orders</a>
                </div>
            </div>
        </div>

        <div class="card shadow-sm p-4">
            <h4 class="mb-3">Your Products</h4>

            <table class="table table-bordered table-striped">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Details</th>
                        <th>Price</th>
                        <th>Image</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody>

                    <tr th:if="${#lists.isEmpty(products)}">
                        <td colspan="7" class="text-danger text-center">
                            No Products Found – Add your first product!
                        </td>
                    </tr>

                    <tr th:each="p : ${products}">
                        <td th:text="${p.id}"></td>
                        <td th:text="${p.productname}"></td>
                        <td th:text="${p.productdetails}"></td>
                        <td th:text="${p.productprice}"></td>
                        <td>
                            <img th:if="${p.productimage != null}" th:src="@{'/request/image/' + ${p.id}}" width="80"
                                height="80" class="rounded">
                            <span th:unless="${p.productimage != null}" class="text-muted small">No image</span>
                        </td>
                        <td>
                            <span th:text="${p.status}"
                                th:classappend="${p.status == 'APPROVED'} ? 'badge bg-success' : (${p.status == 'REJECTED'} ? 'badge bg-danger' : 'badge bg-warning text-dark')">
                            </span>
                        </td>
                        <td>
                            <span class="text-muted small">Waiting for admin</span>
                        </td>
                    </tr>

                </tbody>
            </table>
        </div>

    </div>

</body>

</html>
