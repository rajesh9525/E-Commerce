<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seller Dashboard – NexaMart</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --y: #FFE500;
            --b: #111111;
            --g: #22C55E;
            --t: #6B7280;
            --bdr: #E5E7EB;
            --bg: #FAFAFA;
            --r: #EF4444;
        }

        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg);
            color: var(--b);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* TOP NAVBAR */
        .navbar {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid var(--bdr);
            padding: 12px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        .brand {
            font-size: 24px;
            font-weight: 900;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
        }

        .brand span {
            background: var(--y);
            padding: 2px 8px;
            border-radius: 6px;
            color: var(--b);
            margin-left: 4px;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--t);
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            transition: all 0.2s;
            cursor: pointer;
        }

        .nav-link:hover {
            background: var(--bg);
            color: var(--b);
            transform: translateY(-2px);
        }

        .nav-link.active {
            background: var(--y);
            color: var(--b);
            box-shadow: 3px 3px 0 var(--b);
            border: 2px solid var(--b);
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        /* MAIN */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .topbar {
            padding: 20px 40px;
            border-bottom: 2px solid var(--bdr);
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 90;
        }

        .topbar h5 {
            font-size: 18px;
            font-weight: 900;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--b);
        }

        .badge-role {
            background: var(--b);
            color: var(--y);
            padding: 6px 14px;
            border-radius: 8px;
            font-weight: 900;
            font-size: 12px;
            border: 2px solid var(--b);
        }

        .content {
            padding: 40px;
        }

        .page-banner {
            background: #fff;
            border: 2px solid var(--b);
            border-radius: 20px;
            padding: 28px 40px;
            margin-bottom: 32px;
            box-shadow: 8px 8px 0 var(--y);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-image: radial-gradient(var(--bdr) 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .page-banner h4 {
            font-size: 28px;
            font-weight: 900;
            margin-bottom: 4px;
            background: #fff;
            display: inline-block;
            padding-right: 10px;
        }

        .page-banner p {
            color: var(--t);
            font-size: 14px;
            font-weight: 600;
            background: #fff;
            display: inline-block;
            padding-right: 10px;
        }

        .btn-add {
            padding: 12px 24px;
            border: 2px solid var(--b);
            border-radius: 12px;
            background: var(--y);
            color: var(--b);
            font-weight: 800;
            font-size: 14px;
            text-decoration: none;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-add:hover {
            background: var(--b);
            color: #fff;
            box-shadow: 4px 4px 0 var(--y);
        }

        /* TABLE */
        .table-wrap {
            background: #fff;
            border: 2px solid var(--bdr);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.03);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead th {
            background: var(--bg);
            color: var(--t);
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 16px 20px;
            border-bottom: 2px solid var(--bdr);
            text-align: left;
        }

        tbody tr {
            border-bottom: 1px solid var(--bdr);
            transition: background 0.2s;
        }

        tbody tr:hover {
            background: var(--bg);
        }

        tbody tr:last-child {
            border-bottom: none;
        }

        td {
            padding: 16px 20px;
            font-size: 14px;
            vertical-align: middle;
            font-weight: 600;
        }

        .pimg {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            object-fit: cover;
            border: 2px solid var(--bdr);
        }

        .stat-chip {
            display: inline-flex;
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 800;
            border: 2px solid;
            align-items: center;
            gap: 4px;
        }

        .stat-PENDING {
            background: #FEF3C7;
            color: #D97706;
            border-color: #FCD34D;
        }

        .stat-APPROVED {
            background: #D1FAE5;
            color: #059669;
            border-color: #6EE7B7;
        }

        .stat-REJECTED {
            background: #FEE2E2;
            color: #DC2626;
            border-color: #FCA5A5;
        }

        .empty {
            text-align: center;
            padding: 60px 20px;
            color: var(--t);
        }

        .empty i {
            font-size: 48px;
            color: var(--bdr);
            margin-bottom: 16px;
        }

        .empty p {
            font-weight: 700;
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <div class="brand">Nexa<span>Mart</span></div>
        <div class="nav-links">
            <a href="/sellerdashboard" class="nav-link active"><i class="bi bi-shop-window"></i> My Products</a>
            <a href="/product/add" class="nav-link"><i class="bi bi-plus-square"></i> Add Product</a>
            <a href="/orders/seller" class="nav-link"><i class="bi bi-bag"></i> Orders</a>
        </div>
        <div class="nav-actions">
            <div class="badge-role">SELLER 🏪</div>
            <a href="/logout" class="nav-link"
                style="color:var(--r); border:2px solid var(--r); background:transparent;"><i
                    class="bi bi-box-arrow-right"></i> Sign Out</a>
        </div>
    </nav>

    <div class="main">
        <div class="content">
            <div class="page-banner">
                <div>
                    <h4>Your Products</h4>
                    <p>Manage your catalogue and track approval status</p>
                </div>
                <a href="/product/add" class="btn-add"><i class="bi bi-plus-lg"></i> Add New Product</a>
            </div>

            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Details</th>
                            <th>Price</th>
                            <th>Image</th>
                            <th>Status</th>
                            <th>Note</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>

                        <!-- EMPTY STATE -->
                        <tr th:if="${#lists.isEmpty(products)}">
                            <td colspan="7">
                                <div class="empty">
                                    <i class="bi bi-box-seam"></i>
                                    <p>You haven't added any products yet.</p>
                                </div>
                            </td>
                        </tr>

                        <!-- PRODUCT ROW -->
                        <tr th:each="p : ${products}">

                            <!-- NAME -->
                            <td th:text="${p.productName}"></td>

                            <!-- DETAILS -->
                            <td th:text="${p.productdetails}"
                                style="color:var(--t);font-size:12px;max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">
                            </td>

                            <!-- PRICE -->
                            <td th:text="'₹' + ${p.productprice}" style="color:var(--g);font-weight:800;"></td>

                            <!-- IMAGE -->
                            <td>
                                <img th:if="${p.productimage != null}" th:src="@{'/product/image/' + ${p.id}}"
                                    class="pimg" />

                                <span th:unless="${p.productimage != null}" style="color:var(--bdr);font-size:12px;">
                                    No Image
                                </span>
                            </td>

                            <!-- STATUS -->
                            <td>
                                <span th:class="'stat-chip stat-' + ${p.status}" th:text="${p.status}">
                                </span>
                            </td>

                            <!-- NOTE -->
                            <td style="font-size:12px;color:var(--t);font-weight:500;">
                                <span th:if="${p.status == 'PENDING'}">In admin review queue</span>
                                <span th:if="${p.status == 'APPROVED'}">Live on store</span>
                                <span th:if="${p.status == 'REJECTED'}">Rejected by admin</span>
                            </td>

                            <!-- ACTION -->
                            <td>
                                <a th:href="@{'/product/seller/edit/' + ${p.id}}"
                                    style="padding:6px 12px; border-radius:8px; border:1px solid var(--bdr); color:var(--b); text-decoration:none; font-size:12px; font-weight:700; display:flex; align-items:center; gap:6px; transition:all 0.2s; background:#fff; width:fit-content"
                                    onmouseover="this.style.background='var(--y)'; this.style.borderColor='var(--b)'"
                                    onmouseout="this.style.background='#fff'; this.style.borderColor='var(--bdr)'">
                                    <i class="bi bi-pencil-square"></i> Edit
                                </a>
                            </td>

                        </tr>

                    </tbody>
                </table>
            </div>
        </div>
    </div>

</body>

</html>
