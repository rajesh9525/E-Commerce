<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Place Order – NexaMart</title>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
	<style>
		*,
		*::before,
		*::after {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		body {
			font-family: 'Inter', sans-serif;
			background: #07070f;
			color: #fff;
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 40px 20px;
		}

		.card {
			width: 100%;
			max-width: 480px;
			background: rgba(255, 255, 255, 0.03);
			border: 1px solid rgba(255, 255, 255, 0.08);
			border-radius: 26px;
			padding: 44px 40px;
			animation: up 0.5s ease-out;
			position: relative;
			overflow: hidden;
		}

		.card::before {
			content: '';
			position: absolute;
			top: -100px;
			right: -60px;
			width: 250px;
			height: 250px;
			border-radius: 50%;
			background: radial-gradient(circle, rgba(245, 158, 11, 0.12), transparent);
			pointer-events: none;
		}

		@keyframes up {
			from {
				opacity: 0;
				transform: translateY(20px);
			}

			to {
				opacity: 1;
				transform: translateY(0);
			}
		}

		.brand {
			font-size: 20px;
			font-weight: 900;
			margin-bottom: 28px;
			display: flex;
			align-items: center;
			gap: 10px;
		}

		.brand .n {
			color: #fff;
		}

		.brand .x {
			background: linear-gradient(135deg, #7c3aed, #06b6d4);
			-webkit-background-clip: text;
			-webkit-text-fill-color: transparent;
			background-clip: text;
		}

		h3 {
			font-size: 24px;
			font-weight: 900;
			margin-bottom: 6px;
			display: flex;
			align-items: center;
			gap: 10px;
		}

		.sub {
			color: rgba(255, 255, 255, 0.38);
			font-size: 13px;
			margin-bottom: 30px;
		}

		.field {
			margin-bottom: 18px;
		}

		.field label {
			display: block;
			font-size: 11px;
			font-weight: 700;
			text-transform: uppercase;
			letter-spacing: 0.9px;
			color: rgba(255, 255, 255, 0.4);
			margin-bottom: 7px;
		}

		.inp {
			width: 100%;
			padding: 13px 16px;
			background: rgba(255, 255, 255, 0.05);
			border: 1px solid rgba(255, 255, 255, 0.1);
			border-radius: 13px;
			color: #fff;
			font-size: 14px;
			font-family: 'Inter', sans-serif;
			transition: all 0.3s;
			outline: none;
		}

		.inp:focus {
			border-color: #f59e0b;
			background: rgba(245, 158, 11, 0.06);
			box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.1);
		}

		.inp::placeholder {
			color: rgba(255, 255, 255, 0.2);
		}

		textarea.inp {
			resize: none;
		}

		.btn-buy {
			width: 100%;
			padding: 15px;
			border: none;
			border-radius: 14px;
			margin-top: 8px;
			background: linear-gradient(135deg, #f59e0b, #d97706);
			color: #111;
			font-size: 16px;
			font-weight: 900;
			font-family: 'Inter', sans-serif;
			cursor: pointer;
			box-shadow: 0 0 25px rgba(245, 158, 11, 0.35);
			transition: all 0.3s;
			display: flex;
			align-items: center;
			justify-content: center;
			gap: 10px;
		}

		.btn-buy:hover {
			transform: translateY(-2px);
			box-shadow: 0 0 45px rgba(245, 158, 11, 0.55);
		}

		.back-link {
			display: inline-flex;
			align-items: center;
			gap: 7px;
			color: rgba(255, 255, 255, 0.35);
			text-decoration: none;
			font-size: 13px;
			font-weight: 600;
			margin-bottom: 20px;
			transition: color 0.2s;
		}

		.back-link:hover {
			color: #fcd34d;
		}
	</style>
</head>

<body>
	<div class="card">
		<div class="brand"><span class="n">Nexa</span><span class="x">Mart</span></div>
		<a href="/customer/view-products" class="back-link"><i class="bi bi-arrow-left-circle-fill"></i> Back to
			Shop</a>
		<h3><i class="bi bi-bag-fill" style="color:#fcd34d;"></i> Place Order</h3>
		<p class="sub">Fill in your delivery details to complete the purchase.</p>
		<form action="/orders/buy" method="post">
			<div class="field">
				<label>Product Name</label>
				<input type="text" name="productName" class="inp" placeholder="Product name">
			</div>
			<div class="field">
				<label>Quantity</label>
				<input type="number" name="quantity" class="inp" placeholder="1" min="1">
			</div>
			<div class="field">
				<label>Delivery Address</label>
				<textarea name="address" class="inp" rows="3"
					placeholder="Enter your full delivery address..."></textarea>
			</div>
			<button type="submit" class="btn-buy"><i class="bi bi-cart-check-fill"></i> Confirm Purchase</button>
		</form>
	</div>
</body>

</html>
