<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order History – NexaMart</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --y: #FFE500;
            --b: #111111;
            --g: #22C55E;
            --t: #6B7280;
            --bdr: #E5E7EB;
            --bg: #FAFAFA;
            --r: #EF4444;
        }

        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg);
            color: var(--b);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* TOP NAVBAR */
        .navbar {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid var(--bdr);
            padding: 12px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        .brand {
            font-size: 24px;
            font-weight: 900;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
        }

        .brand span {
            background: var(--y);
            padding: 2px 8px;
            border-radius: 6px;
            color: var(--b);
            margin-left: 4px;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--t);
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            transition: all 0.2s;
            cursor: pointer;
        }

        .nav-link:hover {
            background: var(--bg);
            color: var(--b);
            transform: translateY(-2px);
        }

        .nav-link.active {
            background: var(--y);
            color: var(--b);
            box-shadow: 3px 3px 0 var(--b);
            border: 2px solid var(--b);
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        /* MAIN */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .topbar {
            padding: 20px 40px;
            border-bottom: 2px solid var(--bdr);
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 90;
        }

        .topbar h5 {
            font-size: 18px;
            font-weight: 900;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--b);
        }

        .badge-role {
            background: var(--b);
            color: var(--y);
            padding: 6px 14px;
            border-radius: 8px;
            font-weight: 900;
            font-size: 12px;
            border: 2px solid var(--b);
        }

        .content {
            padding: 40px;
        }

        .page-banner {
            background: #fff;
            border: 2px solid var(--bdr);
            border-radius: 20px;
            padding: 32px 40px;
            margin-bottom: 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.02);
        }

        .page-banner h4 {
            font-size: 32px;
            font-weight: 900;
            margin-bottom: 4px;
        }

        .page-banner p {
            font-size: 15px;
            font-weight: 600;
            color: var(--t);
        }

        .order-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .order-card {
            background: #fff;
            border: 2px solid var(--bdr);
            border-radius: 20px;
            overflow: hidden;
            transition: all 0.3s;
        }

        .order-card:hover {
            border-color: var(--b);
            box-shadow: 6px 6px 0 var(--y);
            transform: translateY(-2px);
        }

        .order-header {
            background: var(--bg);
            padding: 16px 24px;
            border-bottom: 2px solid var(--bdr);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .order-id {
            font-weight: 800;
            font-size: 15px;
        }

        .stat-chip {
            display: inline-flex;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 800;
            border: 2px solid;
            align-items: center;
            gap: 6px;
        }

        .stat-PLACED {
            background: #FEF3C7;
            color: #D97706;
            border-color: #FCD34D;
        }

        .stat-DELIVERED {
            background: #D1FAE5;
            color: #059669;
            border-color: #6EE7B7;
        }

        .stat-ASSIGNED {
            background: #DBEAFE;
            color: #1D4ED8;
            border-color: #93C5FD;
        }

        .stat-CANCELLED {
            background: #FEE2E2;
            color: #DC2626;
            border-color: #FCA5A5;
        }

        .order-body {
            padding: 24px;
            display: flex;
            gap: 24px;
            align-items: flex-start;
        }

        .product-img {
            width: 100px;
            height: 100px;
            border-radius: 12px;
            background: var(--bg);
            border: 1px solid var(--bdr);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
        }

        .product-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-img i {
            font-size: 32px;
            color: var(--bdr);
        }

        .order-details {
            flex: 1;
        }

        .p-name {
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .p-qty {
            font-size: 14px;
            color: var(--t);
            font-weight: 600;
            margin-bottom: 16px;
        }

        .p-price {
            font-size: 20px;
            font-weight: 900;
            color: var(--g);
        }

        .delivery-info {
            background: var(--bg);
            border: 1px dashed var(--bdr);
            border-radius: 12px;
            padding: 16px;
            width: 300px;
            flex-shrink: 0;
        }

        .d-title {
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            color: var(--t);
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .d-text {
            font-size: 14px;
            font-weight: 600;
            color: var(--b);
            line-height: 1.5;
        }

        .d-agent {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px dashed var(--bdr);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .agent-icon {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: var(--b);
            color: var(--y);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .empty {
            text-align: center;
            padding: 80px 20px;
            color: var(--t);
            background: #fff;
            border: 2px dashed var(--bdr);
            border-radius: 20px;
        }

        .empty i {
            font-size: 60px;
            color: var(--bdr);
            margin-bottom: 20px;
            display: block;
        }

        .empty p {
            font-weight: 700;
            font-size: 18px;
        }

        .btn-shop {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;
            background: var(--b);
            color: #fff;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 800;
            font-size: 14px;
            transition: all 0.2s;
        }

        .btn-shop:hover {
            box-shadow: 4px 4px 0 var(--bdr);
            transform: translateY(-2px);
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <div class="brand">Nexa<span>Mart</span></div>
        <div class="nav-links">
            <a href="/customer/view-products" class="nav-link"><i class="bi bi-grid-fill"></i> Browse Shop</a>
            <a href="/cart/view" class="nav-link"><i class="bi bi-cart"></i> My Cart</a>
            <a href="/orders/my-orders" class="nav-link active"><i class="bi bi-bag-check"></i> Order History</a>
        </div>
        <div class="nav-actions">
            <div class="badge-role">CUSTOMER 🛍️</div>
            <a href="/logout" class="nav-link"
                style="color:var(--r); border:2px solid var(--r); background:transparent;"><i
                    class="bi bi-box-arrow-right"></i> Sign Out</a>
        </div>
    </nav>

    <div class="main">
        <div class="content">

            <div th:if="${#lists.isEmpty(orders)}" class="empty">
                <i class="bi bi-bag-x"></i>
                <p>You haven't placed any orders yet.</p>
                <a href="/customer/view-products" class="btn-shop">Start Shopping</a>
            </div>

            <div th:if="${!#lists.isEmpty(orders)}" class="order-list">
                <div class="page-banner">
                    <div>
                        <h4>Purchase History 📦</h4>
                        <p>Track your past and active deliveries</p>
                    </div>
                </div>

                <div class="order-card" th:each="o : ${orders}">
                    <div class="order-header">
                        <div class="order-id" th:text="'Order #' + ${o.id}"></div>
                        <span th:class="'stat-chip stat-' + ${o.status}">
                            <i th:if="${o.status == 'PLACED'}" class="bi bi-clock"></i>
                            <i th:if="${o.status == 'ASSIGNED'}" class="bi bi-truck"></i>
                            <i th:if="${o.status == 'DELIVERED'}" class="bi bi-check-circle-fill"></i>
                            <span th:text="${o.status}"></span>
                        </span>
                    </div>

                    <div class="order-body">
                        <div class="product-img">
                            <!-- Fetch the product from our generated map -->
                            <img th:if="${productMap[o.productid] != null && productMap[o.productid].productimage != null}"
                                th:src="@{'/product/image/' + ${o.productid}}">
                            <i th:unless="${productMap[o.productid] != null && productMap[o.productid].productimage != null}"
                                class="bi bi-box"></i>
                        </div>

                        <div class="order-details">
                            <div class="p-name"
                                th:text="${productMap[o.productid] != null ? productMap[o.productid].productName : 'Unknown Product'}">
                            </div>
                            <div class="p-qty" th:text="'Purchased Qty: ' + ${o.quantity}"></div>
                            <div class="p-price"
                                th:text="${productMap[o.productid] != null ? '₹' + productMap[o.productid].productprice : '₹0.0'}">
                            </div>
                        </div>

                        <div class="delivery-info">
                            <div class="d-title">Delivering To</div>
                            <div class="d-text" th:text="${o.customerName}"></div>
                            <div class="d-text" th:text="${o.address} + ', ' + ${o.city} + ' - ' + ${o.pinCode}"
                                style="font-weight:500; font-size:13px; margin-top:4px;"></div>

                            <div class="d-agent" th:if="${o.deliveryMan != null}">
                                <div class="agent-icon"><i class="bi bi-person-fill"></i></div>
                                <div>
                                    <div
                                        style="font-size:11px; font-weight:800; color:var(--t); text-transform:uppercase;">
                                        Delivery Agent</div>
                                    <div style="font-size:14px; font-weight:700;" th:text="${o.deliveryMan.name}"></div>
                                </div>
                            </div>
                            <div class="d-agent" th:unless="${o.deliveryMan != null}">
                                <div class="agent-icon" style="background:var(--bdr); color:var(--t);"><i
                                        class="bi bi-hourglass-split"></i></div>
                                <div>
                                    <div
                                        style="font-size:11px; font-weight:800; color:var(--t); text-transform:uppercase;">
                                        Delivery Status</div>
                                    <div style="font-size:13px; font-weight:600; color:var(--t);">Awaiting Assignment
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

</body>

</html>
